name: Patch Maniements wildcard consensus

on:
  push:
    branches:
      - maniements-v2-single-db
    paths:
      - .github/workflows/maniements-wildcard-consensus.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maniements-v2-single-db
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch app
        run: python3 scripts/patch_maniements_wildcard_consensus.py
      - name: Verify JavaScript
        run: |
          node --check vercel/play-dds-native/maniements/app.js
          grep -q 'function wildcardConsensus' vercel/play-dds-native/maniements/app.js
          grep -q 'app.js?v=6' vercel/play-dds-native/maniements/index.html
      - name: Commit preview patch
        run: |
          git config user.name 'PONS DDS Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add vercel/play-dds-native/maniements/app.js vercel/play-dds-native/maniements/index.html
          git commit -m 'Add robust wildcard consensus analysis'
          git push origin HEAD:maniements-v2-single-db
