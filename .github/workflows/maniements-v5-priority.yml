name: MANIEMENTS V5 — Priority P1 exact cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "maniements-v5/PRIORITY_START"

permissions:
  contents: write
  actions: write

concurrency:
  group: maniements-v5-priority-p1
  cancel-in-progress: true

jobs:
  paused:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "MANIEMENTS temporarily drained to reserve one GitHub-hosted runner"
