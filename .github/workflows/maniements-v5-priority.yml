  push:
    branches: [main]
    paths:
      - "maniements-v5/PRIORITY_START"

permissions:
  contents: write
  actions: write

concurrency:
  group: maniements-v5-priority-p1
  cancel-in-progress: true

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
