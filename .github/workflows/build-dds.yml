name: Build official DDS 2.9.0 self-contained

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-dds.yml"

permissions:
  contents: read

jobs:
  build-linux-amd64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libboost-all-dev

      - name: Fetch official DDS 2.9.0
        run: |
          git clone --depth 1 --branch v2.9.0 https://github.com/dds-bridge/dds.git dds
          cd dds
          echo "DDS source commit:"
          git rev-parse HEAD
          git status --short
          git describe --tags --always

      - name: Build official shared library
        working-directory: dds/src
        run: |
          make -f Makefiles/Makefile_linux_shared linux
          test -s libdds.so
          file libdds.so
          ldd libdds.so | tee ../../LDD.txt

      - name: Verify expected DDS exports
        working-directory: dds/src
        run: |
          nm -D --defined-only libdds.so | tee ../../DDS_EXPORTS.txt
          grep -q "SolveBoardPBN" ../../DDS_EXPORTS.txt
          grep -q "CalcDDtablePBN" ../../DDS_EXPORTS.txt
          grep -q "DealerPar" ../../DDS_EXPORTS.txt
          grep -q "GetDDSInfo" ../../DDS_EXPORTS.txt

      - name: Prepare self-contained artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/include artifact/lib

          cp dds/src/libdds.so artifact/
          cp dds/include/dll.h artifact/include/
          cp dds/include/portab.h artifact/include/
          cp dds/LICENSE artifact/DDS_LICENSE.txt
          cp DDS_EXPORTS.txt artifact/
          cp LDD.txt artifact/

          BOOST_THREAD="$(ldd dds/src/libdds.so | awk '/libboost_thread/ && /=>/ {print $3; exit}')"
          if [ -z "${BOOST_THREAD}" ] || [ ! -f "${BOOST_THREAD}" ]; then
            echo "Unable to locate resolved libboost_thread dependency" >&2
            exit 1
          fi
          cp -L "${BOOST_THREAD}" artifact/lib/
          BOOST_BASENAME="$(basename "${BOOST_THREAD}")"

          {
            echo "DDS_SOURCE_REPOSITORY=https://github.com/dds-bridge/dds"
            echo "DDS_TAG=v2.9.0"
            echo "DDS_COMMIT=$(git -C dds rev-parse HEAD)"
            echo "RUNNER_OS=${RUNNER_OS}"
            echo "RUNNER_ARCH=${RUNNER_ARCH}"
            echo "COMPILER=$(g++ --version | head -n 1)"
            echo "BOOST_THREAD_SOURCE=${BOOST_THREAD}"
            echo "BOOST_THREAD_BUNDLED=lib/${BOOST_BASENAME}"
          } > artifact/BUILD_INFO.txt

          (
            cd artifact
            sha256sum \
              libdds.so \
              "lib/${BOOST_BASENAME}" \
              include/dll.h \
              include/portab.h \
              DDS_LICENSE.txt \
              BUILD_INFO.txt \
              DDS_EXPORTS.txt \
              LDD.txt \
              > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload self-contained DDS runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: dds-2.9.0-linux-amd64-selfcontained
          path: artifact/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
