name: PLAY R80 native DDS holdout 50x288

on:
  push:
    branches: [ "main" ]
    paths:
      - "r80/R80_TRIGGER.txt"

permissions:
  contents: read

env:
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c
  BOARDS_BLOB: e7295da840c7f5651611f0004c63548adedc74e6
  SAMPLER_BLOB: 0054c505116d8d5824af319800d2307b1e4c8bb7
  EQUIV_BOARDS_BLOB: 6f7699ff0ddf5ef24f2779a6d81fe70cf404ce89
  EQUIV_EXPECTED_BLOB: c2a351f54365fbf2a13a1452d4abeae56b4aed2a

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned native DDS and exact table runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object r80/R80_BOARDS_51_100.tsv)" = "$BOARDS_BLOB"
          test "$(git hash-object r80/R80_SAMPLER_MINI.cjs)" = "$SAMPLER_BLOB"
          test "$(git hash-object r80/R80_EQUIV_BOARDS.tsv)" = "$EQUIV_BOARDS_BLOB"
          test "$(git hash-object r80/R80_EQUIV_140_EXPECTED.tsv.gz.b64)" = "$EQUIV_EXPECTED_BLOB"
          git clone https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout "$ODIN_COMMIT"
          test "$(git -C odin-dds rev-parse HEAD)" = "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -C odin-dds/src
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"
          cat > dds_table_runner.cpp <<'CPP'
          #include <cstring>
          #include <fstream>
          #include <iostream>
          #include <sstream>
          #include <string>
          #include <vector>
          #include "dll.h"
          static std::vector<std::string> splitTabs(const std::string& line){std::vector<std::string> z;std::string x;std::stringstream ss(line);while(std::getline(ss,x,'\t'))z.push_back(x);return z;}
          static void writeCanonical(std::ostream& out,const ddTableResults& t){const int strains[5]={4,0,1,2,3};const int seats[4]={0,2,1,3};bool first=true;for(int si=0;si<5;++si)for(int hi=0;hi<4;++hi){if(!first)out<<',';first=false;out<<t.resTable[strains[si]][seats[hi]];}}
          int main(int argc,char**argv){if(argc!=3)return 2;SetMaxThreads(0);std::ifstream in(argv[1]);std::ofstream out(argv[2]);if(!in||!out)return 3;std::string line;long long rows=0,errors=0;while(std::getline(in,line)){if(line.empty())continue;const auto z=splitTabs(line);if(z.size()!=4)return 4;ddTableDealPBN deal{};std::strncpy(deal.cards,z[3].c_str(),sizeof(deal.cards)-1);ddTableResults table{};const int rc=CalcDDtablePBN(deal,&table);if(rc!=RETURN_NO_FAULT){errors++;continue;}out<<z[0]<<'\t'<<z[1]<<'\t'<<z[2]<<'\t';writeCanonical(out,table);out<<'\n';rows++;}FreeMemory();std::cerr<<"COMPLETE rows="<<rows<<" errors="<<errors<<"\n";return errors?5:0;}
          CPP
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include dds_table_runner.cpp odin-dds/lib/dds.a -pthread -o dds_table_runner
          mkdir -p artifact
          cp dds_table_runner artifact/
          cp odin-dds/lib/dds.a artifact/
          cp odin-dds/external/dds/VENDORED.md artifact/
          sha256sum artifact/* > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r80-native-runner
          path: artifact/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

  validate:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r80-native-runner
          path: runtime
      - name: Validate native DDS against 140 embedded-DDS witnesses
        shell: bash
        run: |
          set -euo pipefail
          chmod +x runtime/dds_table_runner
          test "$(git hash-object r80/R80_SAMPLER_MINI.cjs)" = "$SAMPLER_BLOB"
          test "$(git hash-object r80/R80_EQUIV_BOARDS.tsv)" = "$EQUIV_BOARDS_BLOB"
          test "$(git hash-object r80/R80_EQUIV_140_EXPECTED.tsv.gz.b64)" = "$EQUIV_EXPECTED_BLOB"
          node r80/R80_SAMPLER_MINI.cjs all r80/R80_EQUIV_BOARDS.tsv 20 equiv_input4.tsv
          test "$(wc -l < equiv_input4.tsv)" -eq 140
          base64 -d r80/R80_EQUIV_140_EXPECTED.tsv.gz.b64 > equiv_expected.tsv.gz
          gzip -cd equiv_expected.tsv.gz > equiv_expected.tsv
          test "$(wc -l < equiv_expected.tsv)" -eq 140
          /usr/bin/time -f 'elapsed_sec=%e maxrss_kb=%M' -o EQUIV_TIMING.txt runtime/dds_table_runner equiv_input4.tsv equiv_actual.tsv 2> EQUIV_RUN.log
          diff -u equiv_expected.tsv equiv_actual.tsv
          echo "EQUIVALENCE_140=PASS" | tee EQUIV_STATUS.txt
          cat EQUIV_TIMING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r80-equivalence-140
          path: |
            EQUIV_STATUS.txt
            EQUIV_TIMING.txt
            EQUIV_RUN.log
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

  solve:
    needs: [build, validate]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: ["01","02","03","04","05","06","07","08","09","10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r80-native-runner
          path: runtime
      - name: Solve exact R79 holdout shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          chmod +x runtime/dds_table_runner
          test "$(git hash-object r80/R80_BOARDS_51_100.tsv)" = "$BOARDS_BLOB"
          test "$(git hash-object r80/R80_SAMPLER_MINI.cjs)" = "$SAMPLER_BLOB"
          node r80/R80_SAMPLER_MINI.cjs shard r80/R80_BOARDS_51_100.tsv "$SHARD" input4.tsv
          test "$(wc -l < input4.tsv)" -eq 1440
          /usr/bin/time -f 'elapsed_sec=%e maxrss_kb=%M' -o "R80_S${SHARD}_TIMING.txt" runtime/dds_table_runner input4.tsv "R80_S${SHARD}_TABLES.tsv" 2> "R80_S${SHARD}_RUN.log"
          test "$(wc -l < "R80_S${SHARD}_TABLES.tsv")" -eq 1440
          gzip -9 "R80_S${SHARD}_TABLES.tsv"
          sha256sum "R80_S${SHARD}_TABLES.tsv.gz" "R80_S${SHARD}_TIMING.txt" > "R80_S${SHARD}_SHA256SUMS.txt"
          cat "R80_S${SHARD}_TIMING.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: r80-tables-s${{ matrix.shard }}
          path: |
            R80_S${{ matrix.shard }}_TABLES.tsv.gz
            R80_S${{ matrix.shard }}_TIMING.txt
            R80_S${{ matrix.shard }}_RUN.log
            R80_S${{ matrix.shard }}_SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  aggregate:
    needs: solve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r80-tables-*
          path: incoming
          merge-multiple: true
      - name: Aggregate and validate 14,400 tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir final
          gzip -cd incoming/R80_S*_TABLES.tsv.gz | sort -t $'\t' -k1,1n -k2,2n > final/R80_HOLDOUT_50x288_TABLES.tsv
          test "$(wc -l < final/R80_HOLDOUT_50x288_TABLES.tsv)" -eq 14400
          python3 - <<'PY'
          import json,glob,re
          seen=set(); by_board={}
          for line in open('final/R80_HOLDOUT_50x288_TABLES.tsv',encoding='utf-8'):
              z=line.rstrip('\n').split('\t'); assert len(z)==4
              b,i=int(z[0]),int(z[1]); key=(b,i); assert key not in seen; seen.add(key)
              vals=list(map(int,z[3].split(','))); assert len(vals)==20 and all(0<=x<=13 for x in vals)
              by_board[b]=by_board.get(b,0)+1
          assert set(by_board)==set(range(51,101)), sorted(by_board)
          assert all(n==288 for n in by_board.values()), by_board
          timings={}
          for s in range(1,11):
              p=f'incoming/R80_S{s:02d}_TIMING.txt'; timings[f'S{s:02d}']=open(p,encoding='utf-8').read().strip()
          json.dump({'status':'COMPLETE','rows':len(seen),'boards':len(by_board),'samplesPerBoard':288,'boardRange':[51,100],'timings':timings},open('final/R80_NATIVE_SUMMARY.json','w'),indent=2)
          PY
          gzip -9 final/R80_HOLDOUT_50x288_TABLES.tsv
          cp incoming/R80_S*_TIMING.txt final/
          sha256sum final/* > final/SHA256SUMS.txt
          cat final/R80_NATIVE_SUMMARY.json
      - uses: actions/upload-artifact@v4
        with:
          name: PLAY_R80_HOLDOUT_50x288_NATIVE_TABLES
          path: final/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
