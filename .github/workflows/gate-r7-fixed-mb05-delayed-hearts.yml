name: Gate R7 FIXED MB05 delayed Heart fit

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/gate-r7-fixed-mb05-delayed-hearts.yml"
      - "tools/MB04_TO_MB05_DELAYED_HEARTS_RKCB.patch"

permissions:
  contents: write

env:
  PACKAGE: PONS_R7_FIXED_MB01_D9_GATE_PACKAGE.zip
  R7_CRITIC_SHA: f1991fba7f818668aa55ab1776c63afd6b4f52b3b8a9565b599bc44ec236ca85
  MB01_CRITIC_SHA: 52d548cdd5c41206e89c1d970e12c663850b0955f6157da03bd938dae0df59c8
  MB02_CRITIC_SHA: 6f236dcb597ec5502b44e7e66cd79515051be5268de9f9d010fd621dea8b0511
  MB03_CRITIC_SHA: 7f8c10371be03ed35729f7ca0adbd8a374ebd01afed90aa987fc94ae4e02d35a
  MB04_CRITIC_SHA: 0838c8bba44bea70a7faf719d180683de45c7d5a8c5753483eed5bbdd68c7e8c
  MB05_CRITIC_SHA: cd3ff1ef67e4848b14f526cf0de0c929f9b3df856e0d847b7a37002cf1898468
  MB03_PATCH_SHA: 697fae933ce44104fb4824f2aa8f35aa64d3a78797f9eb28eb04fe877819c9f1
  MB04_PATCH_SHA: 562f2f40e6730c081c7189373ab8c8f5acd2ad29e2d2733db1389c6ad52b41d3
  MB05_PATCH_SHA: 14bb9546a5f634a6c5996a096c68e67bf0a0474c77821ff3432f135e1313770c

jobs:
  gate:
    name: gate ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: S1, seed: 999500000001, deals_sha256: 487008e7999671a05420ff3737a2a55145b6941937339417827da68a41d27d24 }
          - { shard: S2, seed: 999600000001, deals_sha256: 6f191cbce229d49b07efa91e8467048247e8a5387396f153b8103599865c2cca }
          - { shard: S3, seed: 999700000001, deals_sha256: fc95173c45098af22f1dc689edab30ac1e13381dff9a27617c1de8c4f9101b8e }
          - { shard: S4, seed: 999800000001, deals_sha256: d822dc819cc614f402c397e1a050494937efc1eb60744ef89d8cb5ea0b74970c }
          - { shard: S5, seed: 999900000001, deals_sha256: e3bd47f48c05a1a9ff64790c67bfe5930c201986a084d35303e490f4cc82a256 }
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Reconstruct exact MB04 and MB05
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum tools/MB02_TO_MB03_BRANCHK.patch | awk '{print $1}')" = "$MB03_PATCH_SHA"
          test "$(sha256sum tools/MB03_TO_MB04_DELAYED_SPADES_RKCB.patch | awk '{print $1}')" = "$MB04_PATCH_SHA"
          test "$(sha256sum tools/MB04_TO_MB05_DELAYED_HEARTS_RKCB.patch | awk '{print $1}')" = "$MB05_PATCH_SHA"
          rm -rf work && mkdir -p work/pkg work/r7zip work/mb01 work/mb02 work/mb03 work/mb04 work/mb05
          unzip -q "$PACKAGE" -d work/pkg
          (cd work/pkg && sha256sum -c SHA256SUMS.txt)
          unzip -q work/pkg/R7_GREEN.zip -d work/r7zip
          R7_RUNTIME="$(dirname "$(find work/r7zip -type f -name pons-critic.js | head -1)")"
          test -n "$R7_RUNTIME"
          test "$(sha256sum "$R7_RUNTIME/pons-critic.js" | awk '{print $1}')" = "$R7_CRITIC_SHA"
          cp -a "$R7_RUNTIME"/. work/mb01/
          cp work/pkg/MB01_pons-critic.js work/mb01/pons-critic.js
          test "$(sha256sum work/mb01/pons-critic.js | awk '{print $1}')" = "$MB01_CRITIC_SHA"
          cp -a work/mb01/. work/mb02/
          (cd work && patch --batch --forward mb02/pons-critic.js < ../tools/MB01_TO_MB02_D13.patch)
          node --check work/mb02/pons-critic.js
          test "$(sha256sum work/mb02/pons-critic.js | awk '{print $1}')" = "$MB02_CRITIC_SHA"
          cp -a work/mb02/. work/mb03/
          (cd work && patch --batch --forward mb03/pons-critic.js < ../tools/MB02_TO_MB03_BRANCHK.patch)
          node --check work/mb03/pons-critic.js
          test "$(sha256sum work/mb03/pons-critic.js | awk '{print $1}')" = "$MB03_CRITIC_SHA"
          cp -a work/mb03/. work/mb04/
          (cd work && patch --batch --forward mb04/pons-critic.js < ../tools/MB03_TO_MB04_DELAYED_SPADES_RKCB.patch)
          node --check work/mb04/pons-critic.js
          test "$(sha256sum work/mb04/pons-critic.js | awk '{print $1}')" = "$MB04_CRITIC_SHA"
          cp -a work/mb04/. work/mb05/
          (cd work && patch --batch --forward mb05/pons-critic.js < ../tools/MB04_TO_MB05_DELAYED_HEARTS_RKCB.patch)
          node --check work/mb05/pons-critic.js
          test "$(sha256sum work/mb05/pons-critic.js | awk '{print $1}')" = "$MB05_CRITIC_SHA"
      - name: Generate exact fresh 20K shard
        run: |
          python3 work/pkg/GENERATOR.py work/deals.jsonl 20000 "${{ matrix.seed }}"
          test "$(wc -l < work/deals.jsonl)" -eq 20000
          echo "${{ matrix.deals_sha256 }}  work/deals.jsonl" | sha256sum -c -
      - name: Run MB04 and MB05
        run: |
          node work/pkg/GATE_RUNNER_FIXED.mjs "$(realpath work/mb04)" work/deals.jsonl work/mb04.jsonl
          node work/pkg/GATE_RUNNER_FIXED.mjs "$(realpath work/mb05)" work/deals.jsonl work/mb05.jsonl
      - name: Verify exact MB05 domain only
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import json,os
          shard=os.environ['SHARD']
          def load(p):
              d={}
              with open(p) as f:
                  for line in f:
                      x=json.loads(line); d[(int(x['index_global']),int(x['seed']))]=x
              return d
          A=load('work/mb04.jsonl'); B=load('work/mb05.jsonl')
          assert A.keys()==B.keys() and len(A)==20000
          changed=exact=collateral=0; examples=[]
          for k,a in A.items():
              b=B[k]
              if a['auction']==b['auction']: continue
              changed+=1
              n=min(len(a['auction']),len(b['auction']))
              i=next((j for j in range(n) if a['auction'][j]!=b['auction'][j]),n)
              bm=next((m for m in b.get('marks',[]) if m.get('i')==i),None)
              pref=b['auction'][:i]
              try: first=next(j for j,c in enumerate(pref) if c not in ('PASS','X','XX'))
              except StopIteration: first=len(pref)
              rel=pref[first:]
              ok=(i<n and a['auction'][i]=='4H' and b['auction'][i]=='4NT' and bm and
                  bm.get('reviewedSource')=='r7-fixed-mb05-delayed-heart-fit-rkcb-after-opener-3H' and
                  len(rel)==6 and rel[0]=='1H' and rel[1]=='PASS' and rel[2] in ('1S','2C','2D') and
                  rel[3]=='PASS' and rel[4]=='3H' and rel[5]=='PASS')
              if ok: exact+=1
              else:
                  collateral+=1
                  if len(examples)<5: examples.append({'key':k,'i':i,'mb04':a['auction'],'mb05':b['auction'],'mark':bm})
          s={'shard':shard,'deals':20000,'same':20000-changed,'changed':changed,'exact_mb05':exact,'collateral':collateral,'collateral_examples':examples,'status':'SHARD_PASS' if collateral==0 else 'SHARD_FAIL'}
          json.dump(s,open(f'{shard}_SUMMARY.json','w'),indent=2,sort_keys=True)
          print(json.dumps(s,indent=2))
          assert collateral==0 and exact==changed
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mb05-delayed-hearts-${{ matrix.shard }}
          path: ${{ matrix.shard }}_SUMMARY.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mb05-delayed-hearts-*
          path: incoming
          merge-multiple: true
      - name: Aggregate 100K gate
        run: |
          python3 - <<'PY'
          import glob,json,os
          ss=[json.load(open(p)) for p in sorted(glob.glob('incoming/S*_SUMMARY.json'))]
          assert len(ss)==5
          deals=sum(x['deals'] for x in ss); changed=sum(x['changed'] for x in ss); exact=sum(x['exact_mb05'] for x in ss); collateral=sum(x['collateral'] for x in ss)
          assert deals==100000
          status='FINAL_GATE_PASS' if changed>0 and collateral==0 and exact==changed and all(x['status']=='SHARD_PASS' for x in ss) else 'FINAL_GATE_FAIL'
          out={'baseline':'R7_FIXED_MB04_D9_D13_BRANCHK_DELAYED_SPADES_GREEN','candidate':'R7_FIXED_MB05_DELAYED_HEARTS_RKCB_AFTER_OPENER_3H','deals':deals,'same':deals-changed,'changed':changed,'exact_mb05':exact,'collateral':collateral,'status':status,'mb04_critic_sha256':'0838c8bba44bea70a7faf719d180683de45c7d5a8c5753483eed5bbdd68c7e8c','mb05_critic_sha256':'cd3ff1ef67e4848b14f526cf0de0c929f9b3df856e0d847b7a37002cf1898468','mb05_patch_sha256':'14bb9546a5f634a6c5996a096c68e67bf0a0474c77821ff3432f135e1313770c','shards':ss}
          os.makedirs('final',exist_ok=True)
          json.dump(out,open('final/FINAL_GATE_SUMMARY.json','w'),indent=2,sort_keys=True)
          print(json.dumps(out,indent=2))
          assert status=='FINAL_GATE_PASS'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PONS_R7_FIXED_MB05_DELAYED_HEARTS_100K_GATE
          path: final/
          retention-days: 30
      - name: Commit compact result
        run: |
          git pull --rebase origin main
          mkdir -p results/r7-fixed-mb05-delayed-hearts-gate
          cp final/FINAL_GATE_SUMMARY.json results/r7-fixed-mb05-delayed-hearts-gate/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/r7-fixed-mb05-delayed-hearts-gate
          if ! git diff --cached --quiet; then
            git commit -m "Add R7 FIXED MB05 delayed Heart 100K gate result"
            git push origin HEAD:main
          fi
