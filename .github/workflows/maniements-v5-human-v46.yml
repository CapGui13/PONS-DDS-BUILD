name: MANIEMENTS V5 — Human V4.6 semantic exact-tree review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "maniements-v5/dictionary/HUMAN_V46_START"

permissions:
  contents: read

concurrency:
  group: maniements-v5-human-v46
  cancel-in-progress: false

jobs:
  semantic-tree-review:
    name: Build semantically compressed exact human trees
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify frozen V5 runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/MANIEMENTS_V3_GENERATION_V5_PASS_ORBIT_RUNTIME_V2.zip"
          EXPECTED="a0b580531f3c9e8bb00710b9c3e1c183b27cbfe9231c9d584e29a374ba88835d"
          cat \
            maniements-v5/runtime/runtime_v2.b64.part-00 \
            maniements-v5/runtime/runtime_v2.b64.part-01 \
            maniements-v5/runtime/runtime_v2.b64.part-02a \
            maniements-v5/runtime/runtime_v2.b64.part-02b \
            maniements-v5/runtime/runtime_v2.b64.part-03 \
            maniements-v5/runtime/runtime_v2.b64.part-04 \
            maniements-v5/runtime/runtime_v2.b64.part-05 \
            maniements-v5/runtime/runtime_v2.b64.part-06 \
            | base64 -d > "$ZIP"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECTED"
          mkdir -p "$RUNNER_TEMP/v5-runtime"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/v5-runtime"
          (cd "$RUNNER_TEMP/v5-runtime" && sha256sum -c SHA256SUMS.txt)

      - name: Generate semantic exact-tree review
        shell: bash
        run: |
          set -euo pipefail
          python3 maniements-v5/dictionary/human_batch_v46_runner.py \
            --runtime-root "$RUNNER_TEMP/v5-runtime" \
            --reference maniements-v5/dictionary/human_reference_cases_v4.json \
            --x98-reference maniements-v5/dictionary/HUMAN_V43_X98_ARD7_QUALIFICATION.json \
            --out-dir dist
          mv dist/HUMAN_V45_BATCH.json dist/HUMAN_V46_BATCH.json
          mv dist/MANIEMENTS_V5_HUMAN_V45_EXACT_TREE_REVIEW.html dist/MANIEMENTS_V5_HUMAN_V46_SEMANTIC_TREE_REVIEW.html

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: MANIEMENTS_V5_HUMAN_V46_SEMANTIC_TREE_REVIEW
          path: dist/*
          if-no-files-found: error
          retention-days: 30
