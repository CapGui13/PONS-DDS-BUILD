name: Gate MB09-RC13 H4D2C3 HLD20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-mb09-rc13-h4d2c3-hld20.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c
  CANDIDATE_CRITIC_SHA256: 89630222f594a50e935b4ab2e05fa002a416c629db8259dd9a327b2cca1a3dd0

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Solve
        run: |
          set -euo pipefail
          git clone -q https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout -q "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -s -C odin-dds/src
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"
          cat > dds.cpp <<'CPP'
          #include <cstring>
          #include <iostream>
          #include <vector>
          #include "dll.h"
          struct R{int idx;const char* pbn;int dealer,vul,bl,cl,dec;};
          static bool iv(int d,int v){if(v==1)return true;if(v==0)return false;bool ns=d==0||d==2;return v==2?ns:!ns;}
          static int sc(int l,int d,int t,int v){int del=t-(l+6);bool vu=iv(d,v);if(del>=0){int b=30*l,z=b+del*30+(b>=100?(vu?500:300):50);if(l==6)z+=vu?750:500;else if(l==7)z+=vu?1500:1000;return z;}return -(-del)*(vu?100:50);}
          int main(){std::vector<R>rs={
          {167019,"N:KQT54.5.KQ.J9832 J97.JT9.AT832.Q6 A832.AKQ7.J4.K74 6.86432.9765.AT5",3,2,4,5,0},
          {349061,"N:T82.QT5.KJT4.865 QJ763.K6.65.AQ93 K.9842.Q8732.T72 A954.AJ73.A9.KJ4",1,3,6,4,1},
          {354587,"N:43.Q87.J96.JT983 KT86.AK64.A7.K76 A9.9532.Q8542.52 QJ752.JT.KT3.AQ4",3,2,6,4,3},
          {479286,"N:6.JT95.T62.KT532 QJT8.AKQ4.K9.Q94 K75.82.875.AJ876 A9432.763.AQJ43.-",2,1,4,5,3}};SetMaxThreads(0);for(auto&r:rs){ddTableDealPBN d{};std::strncpy(d.cards,r.pbn,sizeof(d.cards)-1);ddTableResults t{};if(CalcDDtablePBN(d,&t)!=RETURN_NO_FAULT)return 2;int tr=t.resTable[0][r.dec];parResultsDealer p{};if(DealerPar(&t,&p,r.dealer,r.vul)!=RETURN_NO_FAULT)return 3;int b=sc(r.bl,r.dec,tr,r.vul),c=sc(r.cl,r.dec,tr,r.vul);if(r.dec==1||r.dec==3){b=-b;c=-c;}std::cout<<r.idx<<'\t'<<tr<<'\t'<<b<<'\t'<<c<<'\t'<<p.score<<'\n';}FreeMemory();}
          CPP
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include dds.cpp odin-dds/lib/dds.a -pthread -o dds
          ./dds > dds.tsv
      - name: Persist
        run: |
          mkdir -p results/mb09-rc13-h4d2c3-hld20
          python3 - <<'PY'
          import json,os
          rows=[]; cnt={'BETTER':0,'WORSE':0,'EQUIVALENT':1}; net=0
          for line in open('dds.tsv'):
            i,t,b,c,p=map(int,line.split()); gb=abs(b-p);gc=abs(c-p);d=gc-gb;v='BETTER' if d<0 else 'WORSE' if d>0 else 'EQUIVALENT';cnt[v]+=1;net+=d;rows.append({'index':i,'dds_tricks':t,'baseline_ns_score':b,'candidate_ns_score':c,'dealer_par_ns_score':p,'gap_delta':d,'verdict':v})
          status='GREEN' if cnt['WORSE']==0 and net<=0 else 'REJECTED'
          out={'status':status,'scope':'MB09-RC13 exact S4-H4-D2-C3 / 20 HLD -> direct fitted 2NT','fresh_deals':500000,'fresh_master_seed':1008000000001,'target_occurrences':5,'changed_contracts':4,'same_contract_changes':1,**cnt,'net_dds_gap_delta':net,'historical_500k_targeted':9,'historical_verdicts_before_patch':{'BETTER':0,'WORSE':3,'EQUIVALENT':6},'historical_old_gap_delta':1750,'candidate_critic_sha256':os.environ['CANDIDATE_CRITIC_SHA256'],'dds_runtime_sha256':os.environ['DDS_A_SHA256'],'rows':rows}
          print(json.dumps(out,indent=2));json.dump(out,open('results/mb09-rc13-h4d2c3-hld20/FRESH_500K_TRUE_DDS_GATE.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git pull --rebase origin main;git add results/mb09-rc13-h4d2c3-hld20/FRESH_500K_TRUE_DDS_GATE.json;git diff --cached --quiet||git commit -m 'Record MB09 RC13 H4D2C3 HLD20 gate';git push
