name: Snapshot MB09 recovery artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-mb09-recover.yml'

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Find latest recovery run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/mb09-500k-dds
          gh api 'repos/CapGui13/PONS-DDS-BUILD/actions/workflows/recover-mb09-aggregate.yml/runs?per_page=5' > /tmp/runs.json
          RUN_ID=$(jq -r '.workflow_runs[0].id' /tmp/runs.json)
          STATUS=$(jq -r '.workflow_runs[0].status' /tmp/runs.json)
          CONCLUSION=$(jq -r '.workflow_runs[0].conclusion // ""' /tmp/runs.json)
          gh api "repos/CapGui13/PONS-DDS-BUILD/actions/runs/$RUN_ID/artifacts?per_page=100" > /tmp/artifacts.json
          jq --arg run_id "$RUN_ID" --arg status "$STATUS" --arg conclusion "$CONCLUSION" '{run_id:($run_id|tonumber),status:$status,conclusion:$conclusion,artifacts:[.artifacts[]|{id,name,size_in_bytes,expired}]}' /tmp/artifacts.json > results/mb09-500k-dds/RECOVERY_ARTIFACT_STATUS.json
          cat results/mb09-500k-dds/RECOVERY_ARTIFACT_STATUS.json
      - name: Persist snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add results/mb09-500k-dds/RECOVERY_ARTIFACT_STATUS.json
          git diff --cached --quiet || git commit -m 'Record MB09 recovery artifact metadata'
          git push
