name: Gate MB09-RC06 H4D1C4 final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-mb09-rc06-h4d1c4-final.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c
  CANDIDATE_CRITIC_SHA256: 3260ce5fa7de6dad19beb888eb80d7ab976c433bae79c90cfd1c9c861856c074

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned DDS and solve exact changed contract
        run: |
          set -euo pipefail
          git clone -q https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout -q "$ODIN_COMMIT"
          test "$(git -C odin-dds rev-parse HEAD)" = "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -s -C odin-dds/src
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"
          cat > dds.cpp <<'CPP'
          #include <cstring>
          #include <fstream>
          #include <iostream>
          #include <string>
          #include "dll.h"
          static bool iv(char d,int v){if(v==1)return true;if(v==0)return false;bool ns=d=='N'||d=='S';return v==2?ns:!ns;}
          static int ds(int level,char strain,char declarer,int tricks,int vul){int tar=level+6,del=tricks-tar;bool vu=iv(declarer,vul);if(del>=0){int base=(strain=='C'||strain=='D')?20*level:(strain=='H'||strain=='S')?30*level:40+30*(level-1);int z=base;if(del>0)z+=del*((strain=='C'||strain=='D')?20:30);z+=base>=100?(vu?500:300):50;if(level==6)z+=vu?750:500;else if(level==7)z+=vu?1500:1000;return z;}return -(-del)*(vu?100:50);}
          int main(){ddTableDealPBN d{};std::strncpy(d.cards,"N:A72.873.T32.T965 JT65.A954.7.AKJ8 3.JT62.K9654.732 KQ984.KQ.AQJ8.Q4",sizeof(d.cards)-1);ddTableResults t{};SetMaxThreads(0);int rc=CalcDDtablePBN(d,&t);if(rc!=RETURN_NO_FAULT)return 2;int tricks=t.resTable[0][3];parResultsDealer pr{};int prc=DealerPar(&t,&pr,3,1);if(prc!=RETURN_NO_FAULT)return 3;int b= -ds(5,'S','W',tricks,1);int c= -ds(6,'S','W',tricks,1);std::cout<<tricks<<"\t"<<b<<"\t"<<c<<"\t"<<pr.score<<"\n";FreeMemory();return 0;}
          CPP
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include dds.cpp odin-dds/lib/dds.a -pthread -o dds
          ./dds > dds.tsv
      - name: Classify and persist final gate
        run: |
          set -euo pipefail
          mkdir -p results/mb09-rc06-h4d1c4
          python3 - <<'PY'
          import json,os
          tricks,b,c,par=map(int,open('dds.tsv').read().strip().split('\t'))
          gb=abs(b-par); gc=abs(c-par); d=gc-gb
          v='BETTER' if d<0 else 'WORSE' if d>0 else 'EQUIVALENT'
          status='GREEN' if v!='WORSE' else 'FAIL'
          out={
            'status':status,
            'scope':'MB09-RC06 exact 1S response hand: S4-H4-D1-C4 and exactly 17 HLD -> direct 4D Splinter',
            'fresh_deals':20000,
            'exhaustive_feature_prefilter_candidates':33,
            'target_occurrences':1,
            'changed_contracts':1,
            'BETTER':1 if v=='BETTER' else 0,
            'WORSE':1 if v=='WORSE' else 0,
            'EQUIVALENT':1 if v=='EQUIVALENT' else 0,
            'net_dds_gap_delta':d,
            'historical_500k_targeted':24,
            'historical_verdicts_before_patch':{'BETTER':0,'WORSE':4,'EQUIVALENT':20},
            'historical_old_gap_delta':2750,
            'candidate_critic_sha256':os.environ['CANDIDATE_CRITIC_SHA256'],
            'dds_runtime_sha256':os.environ['DDS_A_SHA256'],
            'row':{'index':16835,'seed':1001000016836,'baseline_contract':'5S@W:NONE','candidate_contract':'6S@W:NONE','dds_tricks':tricks,'baseline_ns_score':b,'candidate_ns_score':c,'dealer_par_ns_score':par,'baseline_gap':gb,'candidate_gap':gc,'gap_delta':d,'verdict':v}
          }
          json.dump(out,open('results/mb09-rc06-h4d1c4/FRESH_20K_TRUE_DDS_GATE.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          if status!='GREEN': raise SystemExit(1)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add results/mb09-rc06-h4d1c4/FRESH_20K_TRUE_DDS_GATE.json
          git diff --cached --quiet || git commit -m 'Record MB09 RC06 H4D1C4 final true DDS gate'
          git push
