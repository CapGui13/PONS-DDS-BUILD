name: MANIEMENTS V5 — Dictionary V3 qualification suite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "maniements-v5/dictionary/V3_SUITE_START"

permissions:
  contents: read

concurrency:
  group: maniements-v5-dictionary-v3-qualification
  cancel-in-progress: false

jobs:
  qualify-v3:
    name: Qualify V3 compiler on varied bridge combinations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify frozen V5 runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/MANIEMENTS_V3_GENERATION_V5_PASS_ORBIT_RUNTIME_V2.zip"
          EXPECTED="a0b580531f3c9e8bb00710b9c3e1c183b27cbfe9231c9d584e29a374ba88835d"
          cat \
            maniements-v5/runtime/runtime_v2.b64.part-00 \
            maniements-v5/runtime/runtime_v2.b64.part-01 \
            maniements-v5/runtime/runtime_v2.b64.part-02a \
            maniements-v5/runtime/runtime_v2.b64.part-02b \
            maniements-v5/runtime/runtime_v2.b64.part-03 \
            maniements-v5/runtime/runtime_v2.b64.part-04 \
            maniements-v5/runtime/runtime_v2.b64.part-05 \
            maniements-v5/runtime/runtime_v2.b64.part-06 \
            | base64 -d > "$ZIP"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECTED"
          mkdir -p "$RUNNER_TEMP/v5-runtime"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/v5-runtime"
          (cd "$RUNNER_TEMP/v5-runtime" && sha256sum -c SHA256SUMS.txt)

      - name: Run qualification cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > "$RUNNER_TEMP/cases.tsv" <<'EOF'
          AQ2 J963 4 AD2_V963_t4
          AQ2 J963 3 AD2_V963_t3
          AQJ 5432 3 ADV_5432_t3
          AQJ 5432 2 ADV_5432_t2
          KJ2 A963 4 RV2_A963_t4
          KJ2 A963 3 RV2_A963_t3
          AJ2 Q963 3 AV2_D963_t3
          AK2 Q963 4 AR2_D963_t4
          A92 QJ63 3 A92_DV63_t3
          EOF
          while read -r NORTH SOUTH TARGET NAME; do
            echo "=== $NAME : $NORTH / $SOUTH target $TARGET ==="
            python3 maniements-v5/dictionary/prototype_v3_inspect.py \
              --runtime-root "$RUNNER_TEMP/v5-runtime" \
              --north "$NORTH" --south "$SOUTH" --target "$TARGET" \
              > "dist/${NAME}.json"
            python3 maniements-v5/dictionary/prototype_v3_compile.py \
              "dist/${NAME}.json" \
              --output "dist/${NAME}_compiled.json" \
              > /dev/null
          done < "$RUNNER_TEMP/cases.tsv"

      - name: Summarize qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > dist/QUALIFICATION_SUMMARY.md
          import glob, json, os
          rows=[]
          for p in sorted(glob.glob('dist/*_compiled.json')):
              d=json.load(open(p,encoding='utf-8'))
              c=d['case']
              rows.append((os.path.basename(p),c['north'],c['south'],c['target'],d['probability_fraction'],d['confidence'],d['pattern'],d['summary_fr']))
          print('# MANIEMENTS V5 — V3 qualification suite')
          print()
          print('| Cas | Objectif | Proba | Confiance | Motif | Résumé |')
          print('|---|---:|---:|---|---|---|')
          for _,n,s,t,p,conf,pat,summary in rows:
              summary=summary.replace('|','/').replace('\n',' ')
              print(f'| {n} / {s} | {t} | {p} | {conf} | {pat} | {summary} |')
          print()
          from collections import Counter
          cc=Counter(r[5] for r in rows)
          print('Confidence counts:', dict(cc))
          PY
          cat dist/QUALIFICATION_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V3 qualification suite
        uses: actions/upload-artifact@v4
        with:
          name: MANIEMENTS_V5_DICTIONARY_V3_QUALIFICATION
          path: dist/*
          if-no-files-found: error
          retention-days: 30
