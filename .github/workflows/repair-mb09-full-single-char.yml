name: Repair MB09 full single-char scan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mb09-full-single-char.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Scan shard against exact Base64 SHA
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: '8'
          TARGET: 15a8fbaa147906bf197f168a49764fb3cd7fd4b98c75dd2d470b35a9c9ce602d
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, math
          files=[
            'inputs/mb09_dds_v2_b64/part_00',
            'inputs/mb09_indices_b64/part_01',
            'inputs/mb09_indices_b64/part_02',
            'inputs/mb09_indices_b64/part_03',
            'inputs/mb09_indices_b64/part_04',
          ]
          s=b''.join(pathlib.Path(f).read_bytes().replace(b'\r',b'').replace(b'\n',b'') for f in files)
          target=os.environ['TARGET']; shard=int(os.environ['SHARD']); shards=int(os.environ['SHARDS'])
          alpha=b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          chunk=(len(s)+shards-1)//shards; lo=shard*chunk; hi=min(len(s),(shard+1)*chunk)
          found=[]
          for p in range(lo,hi):
            orig=s[p]
            pre=hashlib.sha256(s[:p])
            suffix=s[p+1:]
            for c in alpha:
              if c==orig: continue
              h=pre.copy(); h.update(bytes((c,))); h.update(suffix)
              if h.hexdigest()==target:
                found.append({'global_offset':p,'old':chr(orig),'new':chr(c),'shard':shard})
                break
            if found: break
          out={'shard':shard,'lo':lo,'hi':hi,'found':found}
          pathlib.Path(f'scan_{shard}.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mb09-single-char-scan-${{ matrix.shard }}
          path: scan_${{ matrix.shard }}.json
          compression-level: 9
          retention-days: 2

  apply:
    needs: scan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mb09-single-char-scan-*
          path: scans
          merge-multiple: true
      - name: Apply only an exact proven correction
        env:
          TARGET_B64_SHA: 15a8fbaa147906bf197f168a49764fb3cd7fd4b98c75dd2d470b35a9c9ce602d
          TARGET_XZ_SHA: 1ae3d77b89e862d95fa771cd2e3fe648fbf6c20e282a84c1eb1f4532ddc6c56e
          TARGET_BIN_SHA: 8981d03e6eeca8f843cf7a526b5e8dcb2757e6eab147c7fc00df82c3d0bae68b
        run: |
          set -euo pipefail
          mkdir -p results/mb09-500k-dds
          python3 - <<'PY'
          import glob, hashlib, json, os, pathlib, subprocess
          scans=[json.load(open(f)) for f in sorted(glob.glob('scans/scan_*.json'))]
          hits=[h for x in scans for h in x['found']]
          report={'status':'NO_SINGLE_CHAR_MATCH','hits':hits,'scans':[{k:x[k] for k in ('shard','lo','hi')} for x in scans]}
          if len(hits)==1:
            hit=hits[0]; p=hit['global_offset']; new=ord(hit['new'])
            files=[pathlib.Path('inputs/mb09_dds_v2_b64/part_00'),pathlib.Path('inputs/mb09_indices_b64/part_01'),pathlib.Path('inputs/mb09_indices_b64/part_02'),pathlib.Path('inputs/mb09_indices_b64/part_03'),pathlib.Path('inputs/mb09_indices_b64/part_04')]
            raw=[f.read_bytes().replace(b'\r',b'').replace(b'\n',b'') for f in files]
            s=bytearray(b''.join(raw)); s[p]=new
            assert hashlib.sha256(s).hexdigest()==os.environ['TARGET_B64_SHA']
            xz=subprocess.check_output(['base64','-d'],input=bytes(s)); assert hashlib.sha256(xz).hexdigest()==os.environ['TARGET_XZ_SHA']
            pathlib.Path('/tmp/fixed.xz').write_bytes(xz); subprocess.run(['xz','-t','/tmp/fixed.xz'],check=True)
            binary=subprocess.check_output(['xz','-dc','/tmp/fixed.xz']); assert hashlib.sha256(binary).hexdigest()==os.environ['TARGET_BIN_SHA']
            acc=0
            for f,frag in zip(files,raw):
              if acc <= p < acc+len(frag):
                local=p-acc; b=bytearray(frag); b[local]=new; f.write_bytes(bytes(b)); hit['file']=str(f); hit['local_offset']=local; break
              acc += len(frag)
            report={'status':'REPAIRED_EXACTLY','hit':hit,'b64_sha':os.environ['TARGET_B64_SHA'],'xz_sha':os.environ['TARGET_XZ_SHA'],'bin_sha':os.environ['TARGET_BIN_SHA']}
          elif len(hits)>1:
            report['status']='AMBIGUOUS_MULTIPLE_MATCHES'
          pathlib.Path('results/mb09-500k-dds/FULL_SINGLE_CHAR_SCAN.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Commit scan result and exact repair if any
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add inputs/mb09_dds_v2_b64/part_00 inputs/mb09_indices_b64/part_01 inputs/mb09_indices_b64/part_02 inputs/mb09_indices_b64/part_03 inputs/mb09_indices_b64/part_04 results/mb09-500k-dds/FULL_SINGLE_CHAR_SCAN.json
          git diff --cached --quiet || git commit -m 'Complete MB09 full single-character repair scan'
          git push
      - name: Dispatch final solve after exact repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if grep -q 'REPAIRED_EXACTLY' results/mb09-500k-dds/FULL_SINGLE_CHAR_SCAN.json; then
            gh workflow run solve-mb09-500k-dds.yml --repo CapGui13/PONS-DDS-BUILD --ref main
          fi
