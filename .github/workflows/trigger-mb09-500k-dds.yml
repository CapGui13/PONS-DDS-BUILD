name: Trigger MB09 500K DDS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-mb09-500k-dds.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch final MB09 DDS workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run solve-mb09-500k-dds.yml --repo CapGui13/PONS-DDS-BUILD --ref main
          echo 'Dispatched solve-mb09-500k-dds.yml on main'
