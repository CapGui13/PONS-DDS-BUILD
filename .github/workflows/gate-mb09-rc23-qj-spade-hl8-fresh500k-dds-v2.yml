name: Gate MB09 RC23 QJ spade HL8 fresh 500K DDS v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-mb09-rc23-qj-spade-hl8-fresh500k-dds-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c
  CURRENT_CRITIC_SHA256: 5f062cfd46c93073322b032ade9c236beee9d46a448a7f52201a654b04a24968
  CANDIDATE_CRITIC_SHA256: c4c25813037fd311d85a370bebb69cab251827fe5b2c5c401c7590601602bdf5

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify input scope
        run: |
          set -euo pipefail
          test "$(wc -l < inputs/mb09_rc23_qj_spade_hl8_fresh500k.tsv)" = 70
      - name: Build pinned DDS and solve changed contracts sequentially
        run: |
          set -euo pipefail
          git clone -q https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout -q "$ODIN_COMMIT"
          test "$(git -C odin-dds rev-parse HEAD)" = "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -s -C odin-dds/src
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"
          cat > dds.cpp <<'CPP'
          #include <cstring>
          #include <fstream>
          #include <string>
          #include <vector>
          #include "dll.h"
          struct C{bool po{};int l{};std::string s{"-"};char d{'-'};std::string x{"NONE"};};
          static std::vector<std::string> sp(const std::string&s){std::vector<std::string>v;size_t p=0;for(;;){auto q=s.find('\t',p);if(q==std::string::npos){v.push_back(s.substr(p));break;}v.push_back(s.substr(p,q-p));p=q+1;}return v;}
          static int hc(char c){return c=='N'?0:c=='E'?1:c=='S'?2:3;}
          static int sc(const std::string&s){return s=="S"?0:s=="H"?1:s=="D"?2:s=="C"?3:4;}
          static int vc(const std::string&v){return v=="None"?0:v=="Both"?1:v=="NS"?2:3;}
          static bool iv(char d,int v){if(v==1)return true;if(v==0)return false;bool ns=d=='N'||d=='S';return v==2?ns:!ns;}
          static int ds(const C&c,int t,int v){if(c.po)return 0;int tar=c.l+6,del=t-tar;bool vu=iv(c.d,v);int m=c.x=="XX"?4:c.x=="X"?2:1;if(del>=0){int base=(c.s=="C"||c.s=="D")?20*c.l:(c.s=="H"||c.s=="S")?30*c.l:40+30*(c.l-1);int cp=base*m,z=cp;if(m==2)z+=50;else if(m==4)z+=100;if(del>0){if(m==1)z+=del*((c.s=="C"||c.s=="D")?20:30);else if(m==2)z+=del*(vu?200:100);else z+=del*(vu?400:200);}z+=cp>=100?(vu?500:300):50;if(c.l==6)z+=vu?750:500;else if(c.l==7)z+=vu?1500:1000;return z;}int u=-del,pen;if(m==1)pen=u*(vu?100:50);else{int q;if(vu)q=200+(u-1)*300;else q=u==1?100:u==2?300:u==3?500:500+(u-3)*300;pen=q*(m==4?2:1);}return -pen;}
          static int ns(const C&c,int t,int v){int z=ds(c,t,v);return c.po?0:((c.d=='N'||c.d=='S')?z:-z);}
          int main(){SetMaxThreads(0);std::ifstream in("inputs/mb09_rc23_qj_spade_hl8_fresh500k.tsv");std::ofstream out("dds.tsv");std::string l;while(std::getline(in,l)){auto f=sp(l);if(f.size()!=16)return 2;long long idx=std::stoll(f[1]);unsigned long long seed=std::stoull(f[2]);char dealer=f[3][0];std::string vul=f[4],pbn=f[5];C a,b;auto pc=[&](int o,C&c){c.po=f[o]=="1";c.l=std::stoi(f[o+1]);c.s=f[o+2];c.d=f[o+3][0];c.x=f[o+4];};pc(6,a);pc(11,b);ddTableDealPBN deal{};std::strncpy(deal.cards,pbn.c_str(),sizeof(deal.cards)-1);ddTableResults t{};if(CalcDDtablePBN(deal,&t)!=RETURN_NO_FAULT)return 3;int v=vc(vul),ta=a.po?0:t.resTable[sc(a.s)][hc(a.d)],tb=b.po?0:t.resTable[sc(b.s)][hc(b.d)];int sa=ns(a,ta,v),sb=ns(b,tb,v);parResultsDealer pr{};if(DealerPar(&t,&pr,hc(dealer),v)!=RETURN_NO_FAULT)return 4;out<<idx<<'\t'<<seed<<'\t'<<ta<<'\t'<<sa<<'\t'<<tb<<'\t'<<sb<<'\t'<<pr.score<<'\n';}FreeMemory();return 0;}
          CPP
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include dds.cpp odin-dds/lib/dds.a -pthread -o dds
          ./dds
          test "$(wc -l < dds.tsv)" = 70
      - name: Classify, persist and enforce gate
        run: |
          set -euo pipefail
          mkdir -p results/mb09-rc23-qj-spade-hl8
          python3 - <<'PY'
          import json,os
          rows=[]; c={'BETTER':0,'WORSE':0,'EQUIVALENT':15}; net=0
          for l in open('dds.tsv'):
            z=l.rstrip().split('\t'); idx=int(z[0]); seed=int(z[1]); ta,sa,tb,sb,par=map(int,z[2:7]); ga=abs(sa-par); gb=abs(sb-par); d=gb-ga; v='BETTER' if d<0 else 'WORSE' if d>0 else 'EQUIVALENT'; c[v]+=1; net+=d; rows.append({'index':idx,'seed':seed,'baseline_tricks':ta,'baseline_ns_score':sa,'candidate_tricks':tb,'candidate_ns_score':sb,'dealer_par_ns_score':par,'baseline_gap':ga,'candidate_gap':gb,'gap_delta':d,'verdict':v})
          status='GREEN' if c['WORSE']==0 and net<=0 else 'REJECTED'
          out={'status':status,'scope':'MB09-RC23: suppress only minimum non-vulnerable 1S quality-exception overcall with exact five-card spade QJ supported by T/9, one top honor, HL=8; every other one-level overcall route preserved','fresh_deals':500000,'fresh_master_seed':1017000000001,'public_feature_prefilter':420,'changed_auctions':85,'changed_contracts':70,'same_contract_changes':15,**c,'net_dds_gap_delta':net,'historical_500k_targeted':134,'historical_old_verdicts':{'BETTER':37,'WORSE':56,'EQUIVALENT':41},'historical_old_gap_delta':7800,'historical_candidate_exact_v261_auction':99,'historical_candidate_exact_v261_contract':110,'current_critic_sha256':os.environ['CURRENT_CRITIC_SHA256'],'candidate_critic_sha256':os.environ['CANDIDATE_CRITIC_SHA256'],'dds_runtime_sha256':os.environ['DDS_A_SHA256'],'solver_mode':'sequential CalcDDtablePBN','rows':rows}
          json.dump(out,open('results/mb09-rc23-qj-spade-hl8/FRESH_500K_TRUE_DDS_GATE.json','w'),indent=2); print(json.dumps(out,indent=2)); open('/tmp/status','w').write(status)
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add results/mb09-rc23-qj-spade-hl8/FRESH_500K_TRUE_DDS_GATE.json
          git diff --cached --quiet || git commit -m 'Record MB09 RC23 QJ spade HL8 fresh 500K true DDS gate v2'
          git push
          test "$(cat /tmp/status)" = GREEN
