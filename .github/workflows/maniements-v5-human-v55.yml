name: MANIEMENTS V5 — Human V5.5 co-optimal mask search
on:
  workflow_dispatch:
    inputs:
      max_masks:
        description: "0 = all co-optimal masks; otherwise safety cap per profile"
        required: false
        default: "0"
  push:
    branches: [main]
    paths: ["maniements-v5/dictionary/HUMAN_V55_START"]
permissions:
  contents: read
concurrency:
  group: maniements-v5-human-v55
  cancel-in-progress: true
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/runtime.zip"
          EXPECTED="a0b580531f3c9e8bb00710b9c3e1c183b27cbfe9231c9d584e29a374ba88835d"
          cat maniements-v5/runtime/runtime_v2.b64.part-00 maniements-v5/runtime/runtime_v2.b64.part-01 maniements-v5/runtime/runtime_v2.b64.part-02a maniements-v5/runtime/runtime_v2.b64.part-02b maniements-v5/runtime/runtime_v2.b64.part-03 maniements-v5/runtime/runtime_v2.b64.part-04 maniements-v5/runtime/runtime_v2.b64.part-05 maniements-v5/runtime/runtime_v2.b64.part-06 | base64 -d > "$ZIP"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECTED"
          mkdir -p "$RUNNER_TEMP/v5-runtime" && unzip -q "$ZIP" -d "$RUNNER_TEMP/v5-runtime"
          (cd "$RUNNER_TEMP/v5-runtime" && sha256sum -c SHA256SUMS.txt)
      - name: Rebuild V5.2 normalized corpus
        shell: bash
        run: |
          python3 maniements-v5/dictionary/human_semantic_v52.py --runtime-root "$RUNNER_TEMP/v5-runtime" --reference maniements-v5/dictionary/human_reference_cases_v4.json --out-dir v52
      - name: Search every co-optimal exact success mask for the simplest human policy
        shell: bash
        env:
          MAX_MASKS: ${{ inputs.max_masks || '0' }}
        run: |
          python3 maniements-v5/dictionary/human_mask_search_v55.py --input v52/HUMAN_V52_NORMALIZED.json --runtime-root "$RUNNER_TEMP/v5-runtime" --out-dir dist --max-masks "$MAX_MASKS"
      - run: cat dist/SUMMARY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MANIEMENTS_V5_HUMAN_V55_MASK_SEARCH
          path: dist/*
          if-no-files-found: error
          retention-days: 30
