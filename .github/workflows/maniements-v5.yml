name: MANIEMENTS V5 — 7 lanes cloud

on:
  workflow_dispatch:
    inputs:
      passes_per_job:
        description: "Maximum de tentatives PASS par lane et par workflow"
        required: false
        default: "14"
      auto_continue:
        description: "Relancer automatiquement tant qu'une lane peut encore progresser"
        required: false
        default: "true"
  push:
    branches: [main]
    paths:
      - "maniements-v5/START"

permissions:
  contents: write
  actions: write

concurrency:
  group: maniements-v5-seven-lanes
  cancel-in-progress: false

jobs:
  lanes:
    name: Lane ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        lane: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify frozen V5 runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/MANIEMENTS_V3_GENERATION_V5_PASS_ORBIT_RUNTIME_V2.zip"
          EXPECTED="a0b580531f3c9e8bb00710b9c3e1c183b27cbfe9231c9d584e29a374ba88835d"
          cat \
            maniements-v5/runtime/runtime_v2.b64.part-00 \
            maniements-v5/runtime/runtime_v2.b64.part-01 \
            maniements-v5/runtime/runtime_v2.b64.part-02a \
            maniements-v5/runtime/runtime_v2.b64.part-02b \
            maniements-v5/runtime/runtime_v2.b64.part-03 \
            maniements-v5/runtime/runtime_v2.b64.part-04 \
            maniements-v5/runtime/runtime_v2.b64.part-05 \
            maniements-v5/runtime/runtime_v2.b64.part-06 \
            | base64 -d > "$ZIP"
          ACTUAL=$(sha256sum "$ZIP" | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p "$RUNNER_TEMP/v5-runtime"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/v5-runtime"
          (cd "$RUNNER_TEMP/v5-runtime" && sha256sum -c SHA256SUMS.txt)
          python3 "$RUNNER_TEMP/v5-runtime/runtime/test_orbit_pass_v5.py"

      - name: Checkout durable lane state
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          PAD=$(printf '%02d' "$LANE")
          BRANCH="maniements-v5-lane-${PAD}"
          git fetch origin "$BRANCH:$BRANCH"
          git worktree add "$RUNNER_TEMP/lane-state" "$BRANCH"

      - name: Run durable PASS chain
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          MAX_PASSES: ${{ inputs.passes_per_job || '14' }}
        run: |
          set -euo pipefail
          bash maniements-v5/cloud/run_lane.sh \
            "$LANE" \
            "$RUNNER_TEMP/v5-runtime" \
            "$RUNNER_TEMP/lane-state" \
            "$MAX_PASSES"

  controller:
    name: Progress + automatic continuation
    needs: lanes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect durable lane status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lane-status"
          for L in 0 1 2 3 4 5 6; do
            PAD=$(printf '%02d' "$L")
            B="maniements-v5-lane-${PAD}"
            git fetch origin "$B:refs/remotes/origin/$B"
            git show "refs/remotes/origin/$B:state/progress.json" > "$RUNNER_TEMP/lane-status/lane_${PAD}.json"
            if git cat-file -e "refs/remotes/origin/$B:state/orchestration.json" 2>/dev/null; then
              git show "refs/remotes/origin/$B:state/orchestration.json" > "$RUNNER_TEMP/lane-status/lane_${PAD}.orchestration.json"
            else
              printf '{}\n' > "$RUNNER_TEMP/lane-status/lane_${PAD}.orchestration.json"
            fi
          done
          python3 maniements-v5/cloud/build_status.py \
            "$RUNNER_TEMP/lane-status" \
            maniements-v5/STATUS.md \
            maniements-v5/status.json
          cat maniements-v5/STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish status snapshot robustly
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp maniements-v5/STATUS.md "$RUNNER_TEMP/MANIEMENTS_STATUS.md"
          cp maniements-v5/status.json "$RUNNER_TEMP/maniements_status.json"
          PUSHED=false
          for ATTEMPT in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/MANIEMENTS_STATUS.md" maniements-v5/STATUS.md
            cp "$RUNNER_TEMP/maniements_status.json" maniements-v5/status.json
            git add maniements-v5/STATUS.md maniements-v5/status.json
            if git diff --cached --quiet; then
              PUSHED=true
              break
            fi
            git commit -m "MANIEMENTS V5: update cloud progress"
            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi
            echo "Status push race on attempt ${ATTEMPT}; retrying from latest main."
            sleep $((ATTEMPT*2))
          done
          if [[ "$PUSHED" != "true" ]]; then
            echo "Unable to publish status snapshot after retries." >&2
            exit 42
          fi

      - name: Decide continuation
        id: decide
        shell: bash
        env:
          LANES_RESULT: ${{ needs.lanes.result }}
        run: |
          set -euo pipefail
          read -r ALL_DONE NO_RUNNABLE HARD_STALL_COUNT <<< "$(python3 - <<'PY'
          import json
          s=json.load(open('maniements-v5/status.json'))
          print(
            'true' if s['all_active_lanes_done'] else 'false',
            'true' if s.get('all_unfinished_hard_stalled',False) else 'false',
            s.get('hard_stall_count',0)
          )
          PY
          )"
          STOP=false
          [[ -f maniements-v5/STOP ]] && STOP=true
          echo "all_done=$ALL_DONE" >> "$GITHUB_OUTPUT"
          echo "no_runnable=$NO_RUNNABLE" >> "$GITHUB_OUTPUT"
          echo "hard_stall_count=$HARD_STALL_COUNT" >> "$GITHUB_OUTPUT"
          echo "stop=$STOP" >> "$GITHUB_OUTPUT"
          echo "lanes_result=$LANES_RESULT" >> "$GITHUB_OUTPUT"

      - name: Queue next autonomous cycle
        if: ${{ steps.decide.outputs.all_done != 'true' && steps.decide.outputs.no_runnable != 'true' && steps.decide.outputs.stop != 'true' && steps.decide.outputs.lanes_result == 'success' && (inputs.auto_continue == 'true' || inputs.auto_continue == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PASSES: ${{ inputs.passes_per_job || '14' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PASSES" <<'PY' > "$RUNNER_TEMP/maniements-v5-dispatch.json"
          import json, sys
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "passes_per_job": str(sys.argv[1]),
                  "auto_continue": "true"
              }
          }))
          PY
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/maniements-v5.yml/dispatches" \
            --input "$RUNNER_TEMP/maniements-v5-dispatch.json"
          echo "Next MANIEMENTS V5 cycle queued." >> "$GITHUB_STEP_SUMMARY"

      - name: Stop reason
        if: ${{ steps.decide.outputs.all_done == 'true' || steps.decide.outputs.no_runnable == 'true' || steps.decide.outputs.stop == 'true' || steps.decide.outputs.lanes_result != 'success' }}
        shell: bash
        run: |
          echo "Automatic chain stopped: all_done=${{ steps.decide.outputs.all_done }}, no_runnable=${{ steps.decide.outputs.no_runnable }}, hard_stall_count=${{ steps.decide.outputs.hard_stall_count }}, STOP=${{ steps.decide.outputs.stop }}, lanes_result=${{ steps.decide.outputs.lanes_result }}" >> "$GITHUB_STEP_SUMMARY"
