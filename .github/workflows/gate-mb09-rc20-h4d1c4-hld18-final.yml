name: Gate MB09 RC20 H4D1C4 HLD18 final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-mb09-rc20-h4d1c4-hld18-final.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c
  CANDIDATE_CRITIC_SHA256: 02a4fa30646496701bb3e2cc9a520168d1edce6d3221f20547eb994ce5ed13d8

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned DDS and solve exact changed contract
        run: |
          set -euo pipefail
          git clone -q https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout -q "$ODIN_COMMIT"
          test "$(git -C odin-dds rev-parse HEAD)" = "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -s -C odin-dds/src
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"
          cat > dds.cpp <<'CPP'
          #include <cstring>
          #include <iostream>
          #include "dll.h"
          static int score(int level,int tricks){int del=tricks-(level+6);if(del>=0){int base=30*level;int z=base+del*30+(base>=100?300:50);if(level==6)z+=500;else if(level==7)z+=1000;return z;}return -50*(-del);}
          int main(){
            ddTableDealPBN d{};
            std::strncpy(d.cards,"N:AKQ863.4.Q9.KQ95 T.JT98753.A764.3 J974.AKQ2.8.AT86 52.6.KJT532.J742",sizeof(d.cards)-1);
            ddTableResults t{}; SetMaxThreads(0);
            if(CalcDDtablePBN(d,&t)!=RETURN_NO_FAULT)return 2;
            int tricks=t.resTable[0][0];
            parResultsDealer pr{}; if(DealerPar(&t,&pr,0,0)!=RETURN_NO_FAULT)return 3;
            int b=score(5,tricks), c=score(6,tricks);
            std::cout<<tricks<<"\t"<<b<<"\t"<<c<<"\t"<<pr.score<<"\n";
            FreeMemory(); return 0;
          }
          CPP
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include dds.cpp odin-dds/lib/dds.a -pthread -o dds
          ./dds > dds.tsv
          cat dds.tsv
      - name: Classify and persist
        run: |
          set -euo pipefail
          mkdir -p results/mb09-rc20-h4d1c4-hld18
          python3 - <<'PY'
          import json,os
          tricks,b,c,par=map(int,open('dds.tsv').read().strip().split('\t'))
          gb=abs(b-par); gc=abs(c-par); delta=gc-gb
          verdict='BETTER' if delta<0 else 'WORSE' if delta>0 else 'EQUIVALENT'
          status='GREEN' if verdict!='WORSE' and delta<=0 else 'REJECTED'
          out={
            'status':status,
            'scope':'MB09-RC20 exact 1S-response public hand S4-H4-D1-C4, exactly 18 HLD -> direct 4D Splinter',
            'fresh_deals':500000,
            'fresh_master_seed':1014000000001,
            'public_feature_prefilter':210,
            'changed_auctions':1,
            'changed_contracts':1,
            'BETTER':1 if verdict=='BETTER' else 0,
            'WORSE':1 if verdict=='WORSE' else 0,
            'EQUIVALENT':1 if verdict=='EQUIVALENT' else 0,
            'net_dds_gap_delta':delta,
            'historical_500k_targeted':6,
            'historical_verdicts_before_patch':{'BETTER':0,'WORSE':2,'EQUIVALENT':4},
            'historical_old_gap_delta':1320,
            'candidate_critic_sha256':os.environ['CANDIDATE_CRITIC_SHA256'],
            'dds_runtime_sha256':os.environ['DDS_A_SHA256'],
            'row':{'index':16528,'seed':1014000016529,'dealer':'N','vulnerability':'None','baseline_contract':'5S@N:NONE','candidate_contract':'6S@N:NONE','dds_tricks':tricks,'baseline_ns_score':b,'candidate_ns_score':c,'dealer_par_ns_score':par,'baseline_gap':gb,'candidate_gap':gc,'gap_delta':delta,'verdict':verdict}
          }
          json.dump(out,open('results/mb09-rc20-h4d1c4-hld18/FRESH_500K_TRUE_DDS_GATE.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          open('/tmp/status','w').write(status)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add results/mb09-rc20-h4d1c4-hld18/FRESH_500K_TRUE_DDS_GATE.json
          git diff --cached --quiet || git commit -m 'Record MB09 RC20 H4D1C4 HLD18 final true DDS gate'
          git push
          test "$(cat /tmp/status)" = GREEN
