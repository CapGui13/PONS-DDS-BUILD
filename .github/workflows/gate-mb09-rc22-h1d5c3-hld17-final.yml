name: Gate MB09 RC22 H1D5C3 HLD17 final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-mb09-rc22-h1d5c3-hld17-final.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c
  CANDIDATE_CRITIC_SHA256: 5f062cfd46c93073322b032ade9c236beee9d46a448a7f52201a654b04a24968

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned DDS and solve exact changed contract
        run: |
          set -euo pipefail
          git clone -q https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout -q "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -s -C odin-dds/src
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"
          cat > dds.cpp <<'CPP'
          #include <cstring>
          #include <iostream>
          #include "dll.h"
          static int score(int level,int tricks){int del=tricks-(level+6);if(del>=0){int base=30*level;int z=base+del*30+(base>=100?300:50);if(level==6)z+=500;return z;}return -50*(-del);}
          int main(){ddTableDealPBN d{};std::strncpy(d.cards,"N:983.AJ976.64.KJ4 JT72.4.AKT85.A97 -.Q532.972.T86532 AKQ654.KT8.QJ3.Q",sizeof(d.cards)-1);ddTableResults t{};SetMaxThreads(0);if(CalcDDtablePBN(d,&t)!=RETURN_NO_FAULT)return 2;int tricks=t.resTable[0][3];parResultsDealer pr{};if(DealerPar(&t,&pr,2,0)!=RETURN_NO_FAULT)return 3;int b=-score(5,tricks),c=-score(6,tricks);std::cout<<tricks<<"\t"<<b<<"\t"<<c<<"\t"<<pr.score<<"\n";FreeMemory();return 0;}
          CPP
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include dds.cpp odin-dds/lib/dds.a -pthread -o dds
          ./dds > dds.tsv
      - name: Classify and persist
        run: |
          set -euo pipefail
          mkdir -p results/mb09-rc22-h1d5c3-hld17
          python3 - <<'PY'
          import json,os
          tricks,b,c,par=map(int,open('dds.tsv').read().strip().split('\t'));gb=abs(b-par);gc=abs(c-par);d=gc-gb;v='BETTER' if d<0 else 'WORSE' if d>0 else 'EQUIVALENT';status='GREEN' if v!='WORSE' and d<=0 else 'REJECTED'
          out={'status':status,'scope':'MB09-RC22 exact 1S-response public hand S4-H1-D5-C3, exactly 17 HLD -> direct 4H Splinter','fresh_deals':500000,'fresh_master_seed':1016000000001,'public_feature_prefilter':845,'changed_auctions':6,'changed_contracts':1,'same_contract_changes':5,'BETTER':1 if v=='BETTER' else 0,'WORSE':1 if v=='WORSE' else 0,'EQUIVALENT':5+(1 if v=='EQUIVALENT' else 0),'net_dds_gap_delta':d,'historical_500k_targeted':5,'historical_verdicts_before_patch':{'BETTER':0,'WORSE':2,'EQUIVALENT':3},'historical_old_gap_delta':1500,'candidate_critic_sha256':os.environ['CANDIDATE_CRITIC_SHA256'],'dds_runtime_sha256':os.environ['DDS_A_SHA256'],'row':{'index':61130,'seed':1016000061131,'baseline_contract':'5S@W:NONE','candidate_contract':'6S@W:NONE','dds_tricks':tricks,'baseline_ns_score':b,'candidate_ns_score':c,'dealer_par_ns_score':par,'baseline_gap':gb,'candidate_gap':gc,'gap_delta':d,'verdict':v}}
          json.dump(out,open('results/mb09-rc22-h1d5c3-hld17/FRESH_500K_TRUE_DDS_GATE.json','w'),indent=2);print(json.dumps(out,indent=2));open('/tmp/status','w').write(status)
          PY
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add results/mb09-rc22-h1d5c3-hld17/FRESH_500K_TRUE_DDS_GATE.json
          git diff --cached --quiet || git commit -m 'Record MB09 RC22 H1D5C3 HLD17 fresh 500K true DDS gate'
          git push
          test "$(cat /tmp/status)" = GREEN
