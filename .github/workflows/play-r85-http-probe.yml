name: PLAY R85 HTTP DDS probe
on:
  push:
    branches: ["main"]
    paths: ["r85/R85_PROBE_TRIGGER.txt"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build witness inputs
        run: |
          base64 -d r80/R80_EQUIV_140_EXPECTED.tsv.gz.b64 | gzip -dc > equiv_expected.tsv
          node r80/R80_SAMPLER_MINI.cjs all r80/R80_EQUIV_BOARDS.tsv 20 equiv_input.tsv
          test "$(wc -l < equiv_input.tsv)" -eq 140
      - name: Run bounded HTTP probe
        run: node r85/http_probe.mjs | tee R85_HTTP_PROBE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PLAY_R85_HTTP_DDS_PROBE
          path: |
            R85_HTTP_PROBE.json
            R85_HTTP_PROBE.txt
          retention-days: 30
