name: MANIEMENTS V5 — Dictionary V3 native policy fast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "maniements-v5/dictionary/V3_NATIVE_POLICY_START"

permissions:
  contents: read

concurrency:
  group: maniements-v5-dictionary-v3-native-policy-fast
  cancel-in-progress: false

jobs:
  native-policy-fast:
    name: Export and compress native V5 policies for all five MEDIUM cases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify frozen V5 runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/MANIEMENTS_V3_GENERATION_V5_PASS_ORBIT_RUNTIME_V2.zip"
          EXPECTED="a0b580531f3c9e8bb00710b9c3e1c183b27cbfe9231c9d584e29a374ba88835d"
          cat \
            maniements-v5/runtime/runtime_v2.b64.part-00 \
            maniements-v5/runtime/runtime_v2.b64.part-01 \
            maniements-v5/runtime/runtime_v2.b64.part-02a \
            maniements-v5/runtime/runtime_v2.b64.part-02b \
            maniements-v5/runtime/runtime_v2.b64.part-03 \
            maniements-v5/runtime/runtime_v2.b64.part-04 \
            maniements-v5/runtime/runtime_v2.b64.part-05 \
            maniements-v5/runtime/runtime_v2.b64.part-06 \
            | base64 -d > "$ZIP"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECTED"
          mkdir -p "$RUNNER_TEMP/v5-runtime"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/v5-runtime"
          (cd "$RUNNER_TEMP/v5-runtime" && sha256sum -c SHA256SUMS.txt)

      - name: Export and compress five native policies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # MASK/PROBA are '-' for an ordinary full solve. The KJ2/A963 target-3
          # row replays the exact success mask certified by qualification run
          # 34682631911, avoiding the original ~43-minute full-universe solve.
          cat > "$RUNNER_TEMP/cases.tsv" <<'EOF'
          AQ2 J963 3 AD2_V963_t3 - -
          AJ2 Q963 3 AV2_D963_t3 - -
          AK2 Q963 4 AR2_D963_t4 - -
          A92 QJ63 3 A92_DV63_t3 - -
          KJ2 A963 3 RV2_A963_t3 18441915018640280703 135/161
          EOF
          while read -r NORTH SOUTH TARGET NAME MASK PROBA; do
            echo "=== $NAME : $NORTH / $SOUTH target $TARGET ==="
            EXTRA=()
            if [ "$MASK" != "-" ]; then
              EXTRA+=(--winning-mask "$MASK" --expected-probability "$PROBA")
            fi
            python3 maniements-v5/dictionary/prototype_v3_builtin_policy.py \
              --runtime-root "$RUNNER_TEMP/v5-runtime" \
              --north "$NORTH" --south "$SOUTH" --target "$TARGET" \
              "${EXTRA[@]}" \
              > "dist/${NAME}_native_policy.json"
            python3 maniements-v5/dictionary/prototype_v3_policy_compress.py \
              "dist/${NAME}_native_policy.json" \
              --output "dist/${NAME}_policy_program.json" \
              > /dev/null
          done < "$RUNNER_TEMP/cases.tsv"

      - name: Summarize native policies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > dist/NATIVE_POLICY_SUMMARY.md
          import glob,json
          print('# MANIEMENTS V5 — V3 native public-policy diagnostics')
          print()
          print('| Cas | Proba | Source | Native states | Contexts | Conditional | Leaves | Max depth | Errors |')
          print('|---|---:|---|---:|---:|---:|---:|---:|---:|')
          for p in sorted(glob.glob('dist/*_policy_program.json')):
              d=json.load(open(p,encoding='utf-8'))
              native_path=p.replace('_policy_program.json','_native_policy.json')
              native=json.load(open(native_path,encoding='utf-8'))
              c=d['case']; s=d['program_stats']; source=native['policy_source']['mode']
              print(f"| {c['north']} / {c['south']} → {c['target']} | {d['probability_fraction']} | {source} | {d['native_policy_states']} | {d['context_count']} | {d['conditional_context_count']} | {s['leaves']} | {s['max_conditional_depth']} | {s['unseparable_contexts']} |")
              assert s['unseparable_contexts']==0
          PY
          cat dist/NATIVE_POLICY_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native policies
        uses: actions/upload-artifact@v4
        with:
          name: MANIEMENTS_V5_DICTIONARY_V3_NATIVE_POLICY_FAST
          path: dist/*
          if-no-files-found: error
          retention-days: 30
