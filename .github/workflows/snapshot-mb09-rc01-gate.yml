name: Snapshot MB09 RC01 gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-mb09-rc01-gate.yml'

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot latest gate run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/mb09-rc01
          gh api 'repos/CapGui13/PONS-DDS-BUILD/actions/workflows/gate-mb09-rc01-fresh-dds.yml/runs?per_page=1' > /tmp/r.json
          RUN=$(jq -r '.workflow_runs[0].id' /tmp/r.json)
          STATUS=$(jq -r '.workflow_runs[0].status' /tmp/r.json)
          CONCLUSION=$(jq -r '.workflow_runs[0].conclusion // ""' /tmp/r.json)
          gh api "repos/CapGui13/PONS-DDS-BUILD/actions/runs/$RUN/jobs?per_page=100" > /tmp/j.json
          jq --arg run "$RUN" --arg status "$STATUS" --arg conclusion "$CONCLUSION" '{run_id:($run|tonumber),status:$status,conclusion:$conclusion,jobs:[.jobs[]|{id,name,status,conclusion,failed_steps:[.steps[]?|select(.conclusion=="failure")|.name]}]}' /tmp/j.json > results/mb09-rc01/GATE_RUN_STATUS.json
          cat results/mb09-rc01/GATE_RUN_STATUS.json
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add results/mb09-rc01/GATE_RUN_STATUS.json
          git diff --cached --quiet || git commit -m 'Record MB09 RC01 gate status'
          git push
