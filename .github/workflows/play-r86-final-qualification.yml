name: PLAY R86 final qualification

on:
  push:
    branches: ["main"]
    paths:
      - "r86/R86_FINAL_TRIGGER.txt"

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: 32950300221

jobs:
  final:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r86-runtime
          path: runtime
          repository: CapGui13/PONS-DDS-BUILD
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: r86-corpus
          path: corpus
          repository: CapGui13/PONS-DDS-BUILD
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: r86-parallel-http
          path: parallel
          repository: CapGui13/PONS-DDS-BUILD
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: r86-docker-smoke
          path: docker
          repository: CapGui13/PONS-DDS-BUILD
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: r86-identity-*
          path: identity
          repository: CapGui13/PONS-DDS-BUILD
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run per-board HTTP latency qualification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x runtime/r86_dds_daemon
          gzip -dc corpus/full_in.tsv.gz > full_in.tsv
          gzip -dc corpus/full_exp.tsv.gz > full_exp.tsv
          DDS_RUNNER="$PWD/runtime/r86_dds_daemon" PORT=18086 python3 runtime/r86_dds_server.py > R86_SERVER.log 2>&1 &
          PID=$!
          trap 'kill "$PID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:18086/healthz >/dev/null; then break; fi; sleep 0.25; done
          python3 r86/r86_board_latency.py --input full_in.tsv --expected full_exp.tsv --output R86_BOARD_LATENCY.json
          curl -fsS http://127.0.0.1:18086/healthz > R86_FINAL_HEALTH.json
      - name: Validate full R86 gate and write report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,os,shutil
          lat=json.load(open('R86_BOARD_LATENCY.json'))
          par=json.load(open('parallel/R86_PARALLEL.json'))
          parh=json.load(open('parallel/R86_PARALLEL_HEALTH.json'))
          health=json.load(open('R86_FINAL_HEALTH.json'))
          ids=glob.glob('identity/**/R86_IDENTITY.json',recursive=True)
          assert len(ids)==10, len(ids)
          identity=[]; total=0
          for p in ids:
              x=json.load(open(p)); assert x['status']=='PASS' and x['verified']==1454, (p,x)
              total+=x['verified']; identity.append({'file':p,'verified':x['verified'],'ddsPerSec':x['ddsPerSec']})
          assert total==14540, total
          o=lat['ordinary']
          assert o['t24Ms']['median'] <= 3000, o['t24Ms']
          assert o['t72Ms']['median'] <= 8000, o['t72Ms']
          assert o['t120Ms']['median'] <= 12000, o['t120Ms']
          assert o['t120Ms']['p90'] <= 15000, o['t120Ms']
          assert o['t120Ms']['max'] <= 18000, o['t120Ms']
          assert lat['stressMix']['t120Ms'] <= 18000, lat['stressMix']
          assert par['verified']==72 and par['elapsedMs'] <= 10000, par
          assert parh['restarts']==0, parh
          assert health['restarts']==0, health
          assert 0 < health['maxChildRssKb'] < 450000, health
          docker_health=json.load(open('docker/docker_health.json'))
          assert docker_health['ok'] is True and docker_health['release']=='R86', docker_health
          summary={
            'campaign':'PLAY_R86_NATIVE_HTTP_DDS_FINAL_QUALIFICATION',
            'status':'PASS',
            'sourceQualificationRun':32950300221,
            'exhaustiveIdentityTables':total,
            'ordinaryBoards':lat['selectedBoards'],
            'ordinary24MedianMs':o['t24Ms']['median'],
            'ordinary72MedianMs':o['t72Ms']['median'],
            'ordinary120MedianMs':o['t120Ms']['median'],
            'ordinary120P90Ms':o['t120Ms']['p90'],
            'ordinary120MaxMs':o['t120Ms']['max'],
            'stress120Ms':lat['stressMix']['t120Ms'],
            'parallel3x24Ms':par['elapsedMs'],
            'maxChildRssKb':health['maxChildRssKb'],
            'engineRestarts':health['restarts'],
            'dockerImageBytes':int(open('docker/docker_size_bytes.txt').read().strip()),
            'pins':{
              'odin':'38fcd537dd6c7dec7ef596e861551f1b278f2f98',
              'dds':'7219c956f4ed9a9f8d1585e9a1a2c57465745ac5',
              'dds_a_sha256':'e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c'
            },
            'runtime':'persistent native DDS; 2 threads; internal batch 24; HTTP max 40',
            'playChanged':False,
            'ponsChanged':False,
            'cloudDeployed':False
          }
          os.makedirs('final/r86',exist_ok=True)
          json.dump(summary,open('final/R86_SUMMARY.json','w'),indent=2,sort_keys=True)
          with open('final/R86_REPORT.md','w') as f:
              f.write('# PLAY R86 — backend DDS natif HTTP\n\n')
              f.write('**QUALIFICATION PASS.** PLAY et PONS restent inchangés.\n\n')
              f.write(f"- identité exhaustive via HTTP : **{total:,}/{total:,} tables exactes** ;\n".replace(',', ' '))
              f.write(f"- médiane ordinaire 24 DDS : **{summary['ordinary24MedianMs']/1000:.2f} s** ;\n")
              f.write(f"- médiane ordinaire 72 DDS : **{summary['ordinary72MedianMs']/1000:.2f} s** ;\n")
              f.write(f"- médiane ordinaire 120 DDS : **{summary['ordinary120MedianMs']/1000:.2f} s** ;\n")
              f.write(f"- P90 ordinaire 120 DDS : **{summary['ordinary120P90Ms']/1000:.2f} s** ; max **{summary['ordinary120MaxMs']/1000:.2f} s** ;\n")
              f.write(f"- stress mix témoins difficiles 120 DDS : **{summary['stress120Ms']/1000:.2f} s** ;\n")
              f.write(f"- 3 × 24 requêtes simultanées : **{summary['parallel3x24Ms']/1000:.2f} s** total, sans crash ;\n")
              f.write(f"- RSS max moteur observé : **{summary['maxChildRssKb']/1024:.1f} MiB** ; restarts : **{summary['engineRestarts']}** ;\n")
              f.write(f"- image Docker : **{summary['dockerImageBytes']/1024/1024:.1f} MiB**.\n\n")
              f.write('Le conteneur est prêt à déployer derrière `/api/dds`. Cette qualification couvre le moteur et le chemin HTTP local du conteneur ; la latence Internet et le cold start du fournisseur devront être qualifiés après déploiement.\n')
          for src in ['r86/Dockerfile','r86/r86_dds_daemon.cpp','r86/r86_dds_server.py','r86/r86_http_gate.py','r86/r86_board_latency.py']:
              shutil.copy(src,'final/r86/')
          shutil.copy('R86_BOARD_LATENCY.json','final/')
          shutil.copy('R86_FINAL_HEALTH.json','final/')
          shutil.copy('parallel/R86_PARALLEL.json','final/')
          shutil.copy('parallel/R86_PARALLEL_HEALTH.json','final/')
          shutil.copy('docker/docker_health.json','final/')
          shutil.copy('docker/docker_cors.txt','final/')
          shutil.copy('docker/docker_size_bytes.txt','final/')
          json.dump(identity,open('final/R86_IDENTITY_SHARDS.json','w'),indent=2)
          PY
          (cd final && sha256sum R86_SUMMARY.json R86_REPORT.md R86_BOARD_LATENCY.json R86_IDENTITY_SHARDS.json r86/* > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PLAY_R86_NATIVE_HTTP_DDS_FINAL_QUALIFICATION
          path: final/
          retention-days: 30
