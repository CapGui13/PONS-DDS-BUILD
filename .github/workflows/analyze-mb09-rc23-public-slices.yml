name: Analyze MB09 RC23 public slices

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-mb09-rc23-public-slices.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate public slices
        run: |
          set -euo pipefail
          test "$(wc -l < inputs/mb09_rc23_features85.tsv)" = 85
          python3 - <<'PY'
          import json,itertools,collections
          R=json.load(open('results/mb09-rc23-qj-spade-hl8/FRESH_500K_TRUE_DDS_GATE.json'))
          vr={int(x['index']):x for x in R['rows']}
          feats=[]
          for l in open('inputs/mb09_rc23_features85.tsv'):
            idx,shape,var,op,olen,vul,seat,same=l.rstrip().split('\t')
            x={'index':int(idx),'shape':shape,'variant':var,'openerSuit':op,'openerLen':int(olen),'vul':vul,'seat':seat,'same_contract':bool(int(same))}
            if x['index'] in vr:
              q=vr[x['index']]; x.update(verdict=q['verdict'],gap_delta=q['gap_delta'])
            else:
              assert x['same_contract']; x.update(verdict='EQUIVALENT',gap_delta=0)
            feats.append(x)
          assert len(feats)==85 and sum(x['verdict']=='WORSE' for x in feats)==29 and sum(x['verdict']=='BETTER' for x in feats)==27
          dims=['shape','variant','openerSuit','openerLen','vul','seat']
          def agg(keys):
            d={}
            for x in feats:
              k=tuple(x[a] for a in keys)
              q=d.setdefault(k,{'n':0,'BETTER':0,'WORSE':0,'EQUIVALENT':0,'net':0})
              q['n']+=1;q[x['verdict']]+=1;q['net']+=x['gap_delta']
            out=[]
            for k,q in d.items():
              row={a:v for a,v in zip(keys,k)};row.update(q);out.append(row)
            return sorted(out,key=lambda z:(z['WORSE'],z['net'],-z['n']))
          tables={}
          for r in range(1,4):
            for keys in itertools.combinations(dims,r): tables['+'.join(keys)]=agg(keys)
          zero=[]
          for name,rows in tables.items():
            for z in rows:
              if z['WORSE']==0 and z['n']>=3:
                zero.append({'dimensions':name,**z})
          zero=sorted(zero,key=lambda z:(z['net'],-z['BETTER'],-z['n']))
          out={'source_status':R['status'],'total':85,'BETTER':27,'WORSE':29,'EQUIVALENT':29,'net':R['net_dds_gap_delta'],'zero_worse_slices_n3plus':zero,'tables':tables}
          json.dump(out,open('results/mb09-rc23-qj-spade-hl8/PUBLIC_SLICE_ANALYSIS.json','w'),indent=2)
          print(json.dumps({'best_zero_worse':zero[:30]},indent=2))
          PY
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add results/mb09-rc23-qj-spade-hl8/PUBLIC_SLICE_ANALYSIS.json
          git diff --cached --quiet || git commit -m 'Analyze MB09 RC23 public feature slices'
          git push
