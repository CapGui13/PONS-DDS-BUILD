name: MANIEMENTS V6.2 — Adaptive prefix/residual parallel

on:
  push:
    branches: [main]
    paths:
      - "maniements-v5/product/v6/V62_PREFIX_PARALLEL_START"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        case_id: [BS_B, BS_E, SUITPLAY_ENC, ROUD_2]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/runtime.zip"
          cat maniements-v5/runtime/runtime_v2.b64.part-00 \
              maniements-v5/runtime/runtime_v2.b64.part-01 \
              maniements-v5/runtime/runtime_v2.b64.part-02a \
              maniements-v5/runtime/runtime_v2.b64.part-02b \
              maniements-v5/runtime/runtime_v2.b64.part-03 \
              maniements-v5/runtime/runtime_v2.b64.part-04 \
              maniements-v5/runtime/runtime_v2.b64.part-05 \
              maniements-v5/runtime/runtime_v2.b64.part-06 | base64 -d > "$ZIP"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "a0b580531f3c9e8bb00710b9c3e1c183b27cbfe9231c9d584e29a374ba88835d"
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/unpacked"
      - name: Test ${{ matrix.case_id }}
        shell: bash
        run: |
          python3 maniements-v5/product/v6/diagnose_prefix_residual_v62.py \
            --runtime-root "$RUNNER_TEMP/unpacked" \
            --tools-root maniements-v5/dictionary \
            --case-id "${{ matrix.case_id }}" \
            --output "V62_${{ matrix.case_id }}.json" \
            | tee "V62_${{ matrix.case_id }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: MANIEMENTS_V62_${{ matrix.case_id }}
          path: |
            V62_${{ matrix.case_id }}.json
            V62_${{ matrix.case_id }}.txt
          retention-days: 30
