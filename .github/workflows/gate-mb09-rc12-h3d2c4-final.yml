name: Gate MB09-RC12 H3D2C4 final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-mb09-rc12-h3d2c4-final.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c
  CANDIDATE_CRITIC_SHA256: a301ae816af5db64b8d5c0acbe36c1a93b640e6fedc92cd32cdfe45ae85ebb55

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned DDS and solve changed contracts
        run: |
          set -euo pipefail
          git clone -q https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout -q "$ODIN_COMMIT"
          test "$(git -C odin-dds rev-parse HEAD)" = "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -s -C odin-dds/src
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"
          cat > dds.cpp <<'CPP'
          #include <cstring>
          #include <iostream>
          #include <vector>
          #include <string>
          #include "dll.h"
          struct R{int idx;const char* pbn;int dealer;int vul;int bl;int cl;int dec;};
          static bool iv(int dec,int v){if(v==1)return true;if(v==0)return false;bool ns=dec==0||dec==2;return v==2?ns:!ns;}
          static int score(int level,int dec,int tricks,int v){int tar=level+6,del=tricks-tar,base=30*level;if(del>=0){int z=base+del*30+(base>=100?(iv(dec,v)?500:300):50);if(level==6)z+=iv(dec,v)?750:500;else if(level==7)z+=iv(dec,v)?1500:1000;return z;}return -(-del)*(iv(dec,v)?100:50);}
          int main(){std::vector<R> rs={
            {61197,"N:KJ72.K83.J9.AQJ2 5.Q974.8543.K743 AT864.A62.AKT7.9 Q93.JT5.Q62.T865",1,0,5,6,2},
            {92670,"N:AKT7.KT5.87.KQ32 -.Q964.63.AJT9754 Q96543.7.AKJT4.8 J82.AJ832.Q952.6",2,2,4,5,2},
            {106248,"N:J.82.A9754.AJ976 AT8432.A54.QJT2.- 76.KJ976.86.5432 KQ95.QT3.K3.KQT8",0,3,4,6,1},
            {251273,"N:AQT8.J82.93.AKJ9 4.KT7.JT765.Q832 KJ97653.AQ6.K8.7 2.9543.AQ42.T654",1,1,5,6,2}
          };SetMaxThreads(0);for(auto&r:rs){ddTableDealPBN d{};std::strncpy(d.cards,r.pbn,sizeof(d.cards)-1);ddTableResults t{};if(CalcDDtablePBN(d,&t)!=RETURN_NO_FAULT)return 2;int tricks=t.resTable[0][r.dec];parResultsDealer pr{};if(DealerPar(&t,&pr,r.dealer,r.vul)!=RETURN_NO_FAULT)return 3;int bs=score(r.bl,r.dec,tricks,r.vul),cs=score(r.cl,r.dec,tricks,r.vul);if(r.dec==1||r.dec==3){bs=-bs;cs=-cs;}std::cout<<r.idx<<"\t"<<tricks<<"\t"<<bs<<"\t"<<cs<<"\t"<<pr.score<<"\n";}FreeMemory();return 0;}
          CPP
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include dds.cpp odin-dds/lib/dds.a -pthread -o dds
          ./dds > dds.tsv
      - name: Persist gate
        run: |
          set -euo pipefail
          mkdir -p results/mb09-rc12-h3d2c4
          python3 - <<'PY'
          import json,os
          rows=[]; c={'BETTER':0,'WORSE':0,'EQUIVALENT':6}; net=0
          for line in open('dds.tsv'):
            idx,tr,bs,cs,par=map(int,line.split()); gb=abs(bs-par); gc=abs(cs-par); d=gc-gb
            v='BETTER' if d<0 else 'WORSE' if d>0 else 'EQUIVALENT'; c[v]+=1; net+=d
            rows.append({'index':idx,'dds_tricks':tr,'baseline_ns_score':bs,'candidate_ns_score':cs,'dealer_par_ns_score':par,'baseline_gap':gb,'candidate_gap':gc,'gap_delta':d,'verdict':v})
          status='GREEN' if c['WORSE']==0 and net<=0 else 'REJECTED'
          out={'status':status,'scope':'MB09-RC12 exact S4-H3-D2-C4 / 18 HLD -> direct fitted 2NT','fresh_deals':500000,'fresh_master_seed':1008000000001,'exhaustive_feature_prefilter_candidates':1556,'target_occurrences':10,'changed_contracts':4,'same_contract_changes':6,**c,'net_dds_gap_delta':net,'historical_500k_targeted':17,'historical_verdicts_before_patch':{'BETTER':0,'WORSE':3,'EQUIVALENT':14},'historical_old_gap_delta':2000,'candidate_critic_sha256':os.environ['CANDIDATE_CRITIC_SHA256'],'dds_runtime_sha256':os.environ['DDS_A_SHA256'],'rows':rows}
          print(json.dumps(out,indent=2)); json.dump(out,open('results/mb09-rc12-h3d2c4/FRESH_500K_TRUE_DDS_GATE.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add results/mb09-rc12-h3d2c4/FRESH_500K_TRUE_DDS_GATE.json
          git diff --cached --quiet || git commit -m 'Record MB09 RC12 H3D2C4 fresh 500K true DDS gate'
          git push
