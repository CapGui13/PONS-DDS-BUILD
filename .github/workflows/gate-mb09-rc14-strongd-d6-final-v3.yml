name: Gate MB09 RC14 strong diamonds D6 final v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-mb09-rc14-strongd-d6-final-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c
  CANDIDATE_CRITIC_SHA256: 7ae1a2073ecc430c0a1dec280606eb0386a5f8196eeec2e4c9f480296f795e94

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify scope and build pinned DDS
        run: |
          set -euo pipefail
          test "$(wc -l < inputs/mb09_rc14_strongD_d6_gate42.tsv)" = 42
          test "$(grep -c '^R' inputs/mb09_rc14_strongD_d6_gate42.tsv)" = 14
          test "$(grep -c '^V' inputs/mb09_rc14_strongD_d6_gate42.tsv)" = 28
          git clone -q https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout -q "$ODIN_COMMIT"
          test "$(git -C odin-dds rev-parse HEAD)" = "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -s -C odin-dds/src
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"
      - name: Solve 42 changed contracts with pinned DDS
        run: |
          set -euo pipefail
          cat > dds.cpp <<'CPP'
          #include <cstring>
          #include <fstream>
          #include <iostream>
          #include <string>
          #include <vector>
          #include "dll.h"
          struct C{bool po{};int l{};char s{'-'};char d{'-'};std::string x{"NONE"};};
          static std::vector<std::string> sp(const std::string&s){std::vector<std::string>v;size_t p=0;for(;;){auto q=s.find('\t',p);if(q==std::string::npos){v.push_back(s.substr(p));break;}v.push_back(s.substr(p,q-p));p=q+1;}return v;}
          static int hc(char c){return c=='N'?0:c=='E'?1:c=='S'?2:3;}
          static int sc(char c){return c=='S'?0:c=='H'?1:c=='D'?2:c=='C'?3:4;}
          static int vc(const std::string&v){return v=="None"?0:v=="Both"?1:v=="NS"?2:3;}
          static bool iv(char d,int v){if(v==1)return true;if(v==0)return false;bool ns=d=='N'||d=='S';return v==2?ns:!ns;}
          static int ds(const C&c,int t,int v){if(c.po)return 0;int tar=c.l+6,del=t-tar;bool vu=iv(c.d,v);int m=c.x=="XX"?4:c.x=="X"?2:1;if(del>=0){int base=(c.s=='C'||c.s=='D')?20*c.l:(c.s=='H'||c.s=='S')?30*c.l:40+30*(c.l-1);int cp=base*m,z=cp;if(m==2)z+=50;else if(m==4)z+=100;if(del>0){if(m==1)z+=del*((c.s=='C'||c.s=='D')?20:30);else if(m==2)z+=del*(vu?200:100);else z+=del*(vu?400:200);}z+=cp>=100?(vu?500:300):50;if(c.l==6)z+=vu?750:500;else if(c.l==7)z+=vu?1500:1000;return z;}int u=-del,pen;if(m==1)pen=u*(vu?100:50);else{int q;if(vu)q=200+(u-1)*300;else q=u==1?100:u==2?300:u==3?500:500+(u-3)*300;pen=q*(m==4?2:1);}return -pen;}
          static int ns(const C&c,int t,int v){int z=ds(c,t,v);return c.po?0:((c.d=='N'||c.d=='S')?z:-z);}
          int main(){
            std::ifstream in("inputs/mb09_rc14_strongD_d6_gate42.tsv"); std::ofstream out("dds.tsv"); std::string l; SetMaxThreads(0); int n=0;
            while(std::getline(in,l)){
              auto f=sp(l); if(f.size()!=16){std::cerr<<"bad fields "<<f.size()<<"\n";return 2;}
              char g=f[0][0]; long long idx=std::stoll(f[1]); unsigned long long seed=std::stoull(f[2]); char dealer=f[3][0]; std::string vul=f[4], pbn=f[5]; C a,b;
              auto pc=[&](int o,C&c){c.po=f[o]=="1";c.l=std::stoi(f[o+1]);c.s=f[o+2][0];c.d=f[o+3][0];c.x=f[o+4];}; pc(6,a); pc(11,b);
              ddTableDealPBN d{}; std::strncpy(d.cards,pbn.c_str(),sizeof(d.cards)-1); ddTableResults t{}; int rc=CalcDDtablePBN(d,&t); if(rc!=RETURN_NO_FAULT){std::cerr<<"DDS rc="<<rc<<" idx="<<idx<<"\n";return 3;}
              int v=vc(vul), ta=a.po?0:t.resTable[sc(a.s)][hc(a.d)], tb=b.po?0:t.resTable[sc(b.s)][hc(b.d)]; int sa=ns(a,ta,v), sb=ns(b,tb,v); parResultsDealer pr{}; if(DealerPar(&t,&pr,hc(dealer),v)!=RETURN_NO_FAULT){std::cerr<<"par idx="<<idx<<"\n";return 4;}
              out<<g<<'\t'<<idx<<'\t'<<seed<<'\t'<<ta<<'\t'<<sa<<'\t'<<tb<<'\t'<<sb<<'\t'<<pr.score<<'\n'; n++;
            }
            FreeMemory(); return n==42?0:5;
          }
          CPP
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include dds.cpp odin-dds/lib/dds.a -pthread -o dds
          ./dds
          test "$(wc -l < dds.tsv)" = 42
      - name: Classify and persist
        run: |
          set -euo pipefail
          mkdir -p results/mb09-rc14-strongd-d6
          python3 - <<'PY'
          import json,os
          groups={'R':{'label':'refinement_500k_1010000000001','fresh_deals':500000,'changed_auctions':16,'changed_contracts':14,'same_contract_changes':2},'V':{'label':'independent_validation_500k_1011000000001','fresh_deals':500000,'changed_auctions':43,'changed_contracts':28,'same_contract_changes':15}}
          for q in groups.values(): q.update(BETTER=0,WORSE=0,EQUIVALENT=0,net_dds_gap_delta=0,rows=[])
          for l in open('dds.tsv'):
            z=l.rstrip().split('\t'); g=z[0]; idx=int(z[1]); seed=int(z[2]); ta,sa,tb,sb,par=map(int,z[3:8]); ga=abs(sa-par); gb=abs(sb-par); d=gb-ga; v='BETTER' if d<0 else 'WORSE' if d>0 else 'EQUIVALENT'; q=groups[g]; q[v]+=1; q['net_dds_gap_delta']+=d; q['rows'].append({'index':idx,'seed':seed,'baseline_tricks':ta,'baseline_ns_score':sa,'candidate_tricks':tb,'candidate_ns_score':sb,'dealer_par_ns_score':par,'baseline_gap':ga,'candidate_gap':gb,'gap_delta':d,'verdict':v})
          for q in groups.values(): q['status']='GREEN' if q['WORSE']==0 and q['net_dds_gap_delta']<=0 else 'REJECTED'
          status='GREEN' if all(q['status']=='GREEN' for q in groups.values()) else 'REJECTED'
          out={'status':status,'scope':'MB09-RC14: after 1NT in silence, exact six-card diamond hand with <12 HCP no longer uses direct strong 3D GF; seven-card+ route preserved','public_predicate':'L.D==6 && HCP<12 && L.C<=3 && preFitMinorHld(D)>=15 && diamond_losers<=1','historical_500k_targeted':41,'historical_exact_v261_first_call_restored':41,'historical_verdicts_before_patch':{'BETTER':0,'WORSE':26,'EQUIVALENT':15},'historical_old_gap_delta':18560,'candidate_critic_sha256':os.environ['CANDIDATE_CRITIC_SHA256'],'dds_runtime_sha256':os.environ['DDS_A_SHA256'],'groups':groups}
          json.dump(out,open('results/mb09-rc14-strongd-d6/FINAL_GATE_V3.json','w'),indent=2); print(json.dumps(out,indent=2)); open('/tmp/status','w').write(status)
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add results/mb09-rc14-strongd-d6/FINAL_GATE_V3.json
          git diff --cached --quiet || git commit -m 'Record MB09 RC14 strongD D6 final DDS gate v3'
          git push
          test "$(cat /tmp/status)" = GREEN
