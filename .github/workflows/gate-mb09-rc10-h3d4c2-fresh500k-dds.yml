name: Gate MB09-RC10 H3D4C2 fresh 500K DDS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-mb09-rc10-h3d4c2-fresh500k-dds.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c
  CANDIDATE_CRITIC_SHA256: daf6d16f41628bd1c4312c8b4c0ad7bdc41c07d0c33a1ad019351e3ede651c56

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned DDS and solve changed contracts
        run: |
          set -euo pipefail
          git clone -q https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout -q "$ODIN_COMMIT"
          test "$(git -C odin-dds rev-parse HEAD)" = "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -s -C odin-dds/src
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"
          cat > dds.cpp <<'CPP'
          #include <cstring>
          #include <iostream>
          #include "dll.h"
          struct R{long long idx; const char* pbn; int dealer; int vul; int dec;};
          int main(){R rs[3]={
            {68875,"N:KJ943.AT9.Q43.Q4 75.K54.J8652.J82 AQT6.J83.AKT7.K7 82.Q762.9.AT9653",3,2,0},
            {155900,"N:K6532.K3.KJ6.Q96 987.QJ9852.T8.J5 AQJ4.A74.Q942.A3 T.T6.A753.KT8742",0,1,0},
            {367844,"N:4.T95.JT42.QJT43 JT8752.AQ62.A8.8 Q9.843.Q96.A7652 AK63.KJ7.K753.K9",0,2,1}
          };SetMaxThreads(0);for(auto&r:rs){ddTableDealPBN d{};std::strncpy(d.cards,r.pbn,sizeof(d.cards)-1);ddTableResults t{};if(CalcDDtablePBN(d,&t)!=RETURN_NO_FAULT)return 2;parResultsDealer pr{};if(DealerPar(&t,&pr,r.dealer,r.vul)!=RETURN_NO_FAULT)return 3;std::cout<<r.idx<<'\t'<<t.resTable[0][r.dec]<<'\t'<<pr.score<<'\n';}FreeMemory();}
          CPP
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include dds.cpp odin-dds/lib/dds.a -pthread -o dds
          ./dds > dds.tsv
          test "$(wc -l < dds.tsv)" = 3
      - name: Classify and persist diagnostic
        run: |
          set -euo pipefail
          mkdir -p results/mb09-rc10-h3d4c2
          python3 - <<'PY'
          import json,os
          data={int(z[0]):(int(z[1]),int(z[2])) for z in (l.rstrip().split('\t') for l in open('dds.tsv'))}
          def score(level,tricks,vul):
            d=tricks-(level+6)
            if d<0:return (-d)*(-100 if vul else -50)
            base=30*level;z=base+d*30+(500 if vul else 300)
            if level==6:z+=750 if vul else 500
            elif level==7:z+=1500 if vul else 1000
            return z
          specs={68875:(6,4,True,1),155900:(6,4,True,1),367844:(4,6,False,-1)}
          rows=[];B=W=E=0;net=0
          for idx,(bl,cl,vul,orient) in specs.items():
            tricks,par=data[idx];bs=score(bl,tricks,vul)*orient;cs=score(cl,tricks,vul)*orient;bg=abs(bs-par);cg=abs(cs-par);d=cg-bg;v='BETTER' if d<0 else 'WORSE' if d>0 else 'EQUIVALENT';B+=v=='BETTER';W+=v=='WORSE';E+=v=='EQUIVALENT';net+=d;rows.append({'index':idx,'dds_tricks':tricks,'baseline_ns_score':bs,'candidate_ns_score':cs,'dealer_par_ns_score':par,'baseline_gap':bg,'candidate_gap':cg,'gap_delta':d,'verdict':v})
          E+=3 # exact same final contract on indices 132230,221882,491959
          status='GREEN' if W==0 and net<=0 else 'REJECTED'
          out={'status':status,'scope':'MB09-RC10 exact S4-H3-D4-C2 / 20 HLD -> direct fitted 2NT','fresh_deals':500000,'fresh_master_seed':1006000000001,'exhaustive_feature_prefilter_candidates':893,'target_occurrences':6,'changed_contracts':3,'same_contract_changes':3,'BETTER':B,'WORSE':W,'EQUIVALENT':E,'net_dds_gap_delta':net,'historical_500k_targeted':7,'historical_verdicts_before_patch':{'BETTER':0,'WORSE':4,'EQUIVALENT':3},'historical_old_gap_delta':2250,'candidate_critic_sha256':os.environ['CANDIDATE_CRITIC_SHA256'],'dds_runtime_sha256':os.environ['DDS_A_SHA256'],'rows':rows}
          json.dump(out,open('results/mb09-rc10-h3d4c2/FRESH_500K_TRUE_DDS_DIAGNOSTIC.json','w'),indent=2);print(json.dumps(out,indent=2))
          PY
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add results/mb09-rc10-h3d4c2/FRESH_500K_TRUE_DDS_DIAGNOSTIC.json
          git diff --cached --quiet || git commit -m 'Record MB09 RC10 H3D4C2 fresh 500K true DDS diagnostic'
          git push
