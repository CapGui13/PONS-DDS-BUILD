name: MANIEMENTS V6.1 — Oracle humanization diagnostic

on:
  push:
    branches: [main]
    paths:
      - "maniements-v5/product/v6/V61_START"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/runtime.zip"
          cat maniements-v5/runtime/runtime_v2.b64.part-00               maniements-v5/runtime/runtime_v2.b64.part-01               maniements-v5/runtime/runtime_v2.b64.part-02a               maniements-v5/runtime/runtime_v2.b64.part-02b               maniements-v5/runtime/runtime_v2.b64.part-03               maniements-v5/runtime/runtime_v2.b64.part-04               maniements-v5/runtime/runtime_v2.b64.part-05               maniements-v5/runtime/runtime_v2.b64.part-06 | base64 -d > "$ZIP"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "a0b580531f3c9e8bb00710b9c3e1c183b27cbfe9231c9d584e29a374ba88835d"
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/unpacked"
      - name: Diagnose ARX92 / 765 target 4
        shell: bash
        run: |
          python3 maniements-v5/dictionary/prototype_v3_inspect.py             --runtime-root "$RUNNER_TEMP/unpacked"             --north AKT92 --south 765 --target 4             > V61_ARX92_765_T4.json
          python3 - <<'PY'
          import json
          r=json.load(open("V61_ARX92_765_T4.json"))
          print(json.dumps({
            "probability_fraction":r["probability_fraction"],
            "root_lead":r["root_lead"],
            "root_action_probabilities":r["root_action_probabilities"],
            "support_features":r["support_features"],
            "first_defender_branches":[{
              "defender":x["defender"],"card":x["card"],
              "mass":x["compatible_success_mass"],
              "next":x.get("next_declarer_action"),
              "continuation":x.get("principal_continuation",[])[:12]
            } for x in r["first_defender_branches"]]
          },ensure_ascii=False,indent=2))
          PY
      - name: Certify adaptive deep-finesse motif
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          from fractions import Fraction
          from pathlib import Path
          sys.path.insert(0, str(Path("$RUNNER_TEMP/unpacked")/"runtime"))
          sys.path.insert(0, "maniements-v5/dictionary")
          import integrated_engine as eng
          import human_motif_v61_adaptive_double_finesse as v61
          p,m=v61.evaluate(eng,"AKT92","765",4)
          oracle=Fraction(eng.Engine2("AKT92","765",4).solve(include_policy=False)["probability_fraction"])
          print("V61 motif",p,"oracle",oracle,"mask",m)
          assert p==oracle==Fraction(103,115),(p,oracle)
          print("GREEN V6.1 ARX92/765 target4 exact motif")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MANIEMENTS_V61_ARX92_765_T4_DIAGNOSTIC
          path: V61_ARX92_765_T4.json
          retention-days: 30
