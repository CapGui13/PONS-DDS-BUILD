name: Gate MB09-RC17 H5D3C1 HLD19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-mb09-rc17-h5d3c1-hld19.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c
  CANDIDATE_CRITIC_SHA256: b640b7138b909b94918d4697d3ababadf4a3d637b75eb6b7f63f4561e1fe8932

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Solve
        run: |
          set -euo pipefail
          git clone -q https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout -q "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -s -C odin-dds/src
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"
          cat > dds.cpp <<'CPP'
          #include <cstring>
          #include <iostream>
          #include <vector>
          #include "dll.h"
          struct R{int idx;const char* pbn;int dealer,vul,dec;};
          static bool iv(int d,int v){if(v==1)return true;if(v==0)return false;bool ns=d==0||d==2;return v==2?ns:!ns;}
          static int sc(int l,int d,int t,int v){int del=t-(l+6);bool vu=iv(d,v);if(del>=0){int b=30*l,z=b+del*30+(b>=100?(vu?500:300):50);if(l==6)z+=vu?750:500;return z;}return -(-del)*(vu?100:50);}
          int main(){std::vector<R>rs={{263836,"N:A7542.A7.AKT7.43 K3.J98.J8652.QJT QJ98.KQ652.Q93.A T6.T43.4.K987652",0,1,0},{311582,"N:K987.KQ962.AQ4.T 65.T873.6.Q98543 AJT42.A.J975.AK7 Q3.J54.KT832.J62",2,2,2}};SetMaxThreads(0);for(auto&r:rs){ddTableDealPBN d{};std::strncpy(d.cards,r.pbn,sizeof(d.cards)-1);ddTableResults t{};if(CalcDDtablePBN(d,&t)!=RETURN_NO_FAULT)return 2;int tr=t.resTable[0][r.dec];parResultsDealer p{};if(DealerPar(&t,&p,r.dealer,r.vul)!=RETURN_NO_FAULT)return 3;int b=sc(5,r.dec,tr,r.vul),c=sc(6,r.dec,tr,r.vul);std::cout<<r.idx<<'\t'<<tr<<'\t'<<b<<'\t'<<c<<'\t'<<p.score<<'\n';}FreeMemory();}
          CPP
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include dds.cpp odin-dds/lib/dds.a -pthread -o dds
          ./dds > dds.tsv
      - name: Persist
        run: |
          mkdir -p results/mb09-rc17-h5d3c1-hld19
          python3 - <<'PY'
          import json,os
          rows=[];cnt={'BETTER':0,'WORSE':0,'EQUIVALENT':6};net=0
          for line in open('dds.tsv'):
            i,t,b,c,p=map(int,line.split());gb=abs(b-p);gc=abs(c-p);d=gc-gb;v='BETTER' if d<0 else 'WORSE' if d>0 else 'EQUIVALENT';cnt[v]+=1;net+=d;rows.append({'index':i,'dds_tricks':t,'baseline_ns_score':b,'candidate_ns_score':c,'dealer_par_ns_score':p,'gap_delta':d,'verdict':v})
          status='GREEN' if cnt['WORSE']==0 and net<=0 else 'REJECTED'
          out={'status':status,'scope':'MB09-RC17 exact S4-H5-D3-C1 / 19 HLD -> direct 4C Splinter','fresh_deals':500000,'fresh_master_seed':1008000000001,'target_occurrences':8,'changed_contracts':2,'same_contract_changes':6,**cnt,'net_dds_gap_delta':net,'historical_500k_targeted':8,'historical_verdicts_before_patch':{'BETTER':0,'WORSE':3,'EQUIVALENT':5},'historical_old_gap_delta':1320,'candidate_critic_sha256':os.environ['CANDIDATE_CRITIC_SHA256'],'dds_runtime_sha256':os.environ['DDS_A_SHA256'],'rows':rows}
          print(json.dumps(out,indent=2));json.dump(out,open('results/mb09-rc17-h5d3c1-hld19/FRESH_500K_TRUE_DDS_GATE.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git pull --rebase origin main;git add results/mb09-rc17-h5d3c1-hld19/FRESH_500K_TRUE_DDS_GATE.json;git diff --cached --quiet||git commit -m 'Record MB09 RC17 H5D3C1 HLD19 gate';git push
