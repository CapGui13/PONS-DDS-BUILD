name: MANIEMENTS V5 — Human V5.11R reviewed prefix audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["maniements-v5/dictionary/HUMAN_V511R_START"]
permissions:
  contents: read
concurrency:
  group: maniements-v5-human-v511r
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Verify frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/runtime.zip"; EXPECTED="a0b580531f3c9e8bb00710b9c3e1c183b27cbfe9231c9d584e29a374ba88835d"
          cat maniements-v5/runtime/runtime_v2.b64.part-00 maniements-v5/runtime/runtime_v2.b64.part-01 maniements-v5/runtime/runtime_v2.b64.part-02a maniements-v5/runtime/runtime_v2.b64.part-02b maniements-v5/runtime/runtime_v2.b64.part-03 maniements-v5/runtime/runtime_v2.b64.part-04 maniements-v5/runtime/runtime_v2.b64.part-05 maniements-v5/runtime/runtime_v2.b64.part-06 | base64 -d > "$ZIP"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECTED"
          mkdir -p "$RUNNER_TEMP/v5-runtime" && unzip -q "$ZIP" -d "$RUNNER_TEMP/v5-runtime"
          (cd "$RUNNER_TEMP/v5-runtime" && sha256sum -c SHA256SUMS.txt)
      - name: Audit reviewed motif prefixes only
        run: python3 maniements-v5/dictionary/human_prefix_reviewed_v511r.py --runtime-root "$RUNNER_TEMP/v5-runtime" --out-dir dist
      - run: cat dist/SUMMARY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MANIEMENTS_V5_HUMAN_V511R_REVIEWED_PREFIX
          path: dist/*
          retention-days: 30
