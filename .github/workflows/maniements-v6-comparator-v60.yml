name: MANIEMENTS V6.0 — Maneuver comparator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "maniements-v5/product/v6/V60_START"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/runtime.zip"
          EXPECTED="a0b580531f3c9e8bb00710b9c3e1c183b27cbfe9231c9d584e29a374ba88835d"
          cat             maniements-v5/runtime/runtime_v2.b64.part-00             maniements-v5/runtime/runtime_v2.b64.part-01             maniements-v5/runtime/runtime_v2.b64.part-02a             maniements-v5/runtime/runtime_v2.b64.part-02b             maniements-v5/runtime/runtime_v2.b64.part-03             maniements-v5/runtime/runtime_v2.b64.part-04             maniements-v5/runtime/runtime_v2.b64.part-05             maniements-v5/runtime/runtime_v2.b64.part-06             | base64 -d > "$ZIP"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECTED"
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/unpacked"
          (cd "$RUNNER_TEMP/unpacked" && sha256sum -c SHA256SUMS.txt)

      - name: Assemble V6.0 workspace
        shell: bash
        run: |
          set -euo pipefail
          ROOT="dist/MANIEMENTS_V6_COMPARATEUR_V60"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/runtime" "$ROOT/engine_tools"
          cp maniements-v5/product/v6/comparator_v60.py "$ROOT/"
          cp maniements-v5/product/v6/smoke_test_v60.py "$ROOT/"
          cp maniements-v5/product/v6/README.md "$ROOT/"
          cp -a "$RUNNER_TEMP/unpacked/runtime/." "$ROOT/runtime/"
          cp maniements-v5/dictionary/*.py "$ROOT/engine_tools/"

      - name: Run ARX92 / 765 blocking regression
        working-directory: dist/MANIEMENTS_V6_COMPARATEUR_V60
        shell: bash
        run: |
          set -euo pipefail
          python3 smoke_test_v60.py | tee SMOKE.txt

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -qr MANIEMENTS_V6_COMPARATEUR_V60.zip MANIEMENTS_V6_COMPARATEUR_V60

      - uses: actions/upload-artifact@v4
        with:
          name: MANIEMENTS_V6_COMPARATEUR_V60
          path: dist/MANIEMENTS_V6_COMPARATEUR_V60.zip
          retention-days: 30
