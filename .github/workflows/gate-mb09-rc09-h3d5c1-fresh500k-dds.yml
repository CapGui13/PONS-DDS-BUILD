name: Gate MB09-RC09 H3D5C1 fresh 500K DDS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-mb09-rc09-h3d5c1-fresh500k-dds.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c
  CANDIDATE_CRITIC_SHA256: 876981152c727b39ae68b9cc13972611a7a0001655153dabc3ff8aa9e73a5440

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned DDS and solve two changed contracts
        run: |
          set -euo pipefail
          git clone -q https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout -q "$ODIN_COMMIT"
          test "$(git -C odin-dds rev-parse HEAD)" = "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -s -C odin-dds/src
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"
          cat > dds.cpp <<'CPP'
          #include <cstring>
          #include <iostream>
          #include "dll.h"
          struct R{long long idx; const char* pbn; int dealer; int vul; int dec;};
          int main(){
            R rs[2]={
              {288696,"N:T5.J6542.AJ2.863 J8432.AK.T65.AQT 76.T87.84.KJ9754 AKQ9.Q93.KQ973.2",0,3,1},
              {303072,"N:KJ8754.J872.-.KQ7 T63.T4.A9872.AJ6 AQ92.AK9.QJ653.8 -.Q653.KT4.T95432",0,0,0}
            };
            SetMaxThreads(0);
            for(auto &r:rs){ddTableDealPBN d{};std::strncpy(d.cards,r.pbn,sizeof(d.cards)-1);ddTableResults t{};int rc=CalcDDtablePBN(d,&t);if(rc!=RETURN_NO_FAULT)return 2;parResultsDealer pr{};int prc=DealerPar(&t,&pr,r.dealer,r.vul);if(prc!=RETURN_NO_FAULT)return 3;int tricks=t.resTable[0][r.dec];std::cout<<r.idx<<'\t'<<tricks<<'\t'<<pr.score<<'\n';}
            FreeMemory(); return 0;
          }
          CPP
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include dds.cpp odin-dds/lib/dds.a -pthread -o dds
          ./dds > dds.tsv
          test "$(wc -l < dds.tsv)" = 2
      - name: Classify and persist diagnostic
        run: |
          set -euo pipefail
          mkdir -p results/mb09-rc09-h3d5c1
          python3 - <<'PY'
          import json,os
          data={int(z[0]):(int(z[1]),int(z[2])) for z in (l.rstrip().split('\t') for l in open('dds.tsv'))}
          def score(level,tricks,vul):
            target=level+6; d=tricks-target
            if d<0: return (-d)*(-100 if vul else -50)
            base=30*level; z=base + d*30 + (500 if vul else 300)
            if level==6: z += 750 if vul else 500
            elif level==7: z += 1500 if vul else 1000
            return z
          specs={288696:(4,6,True,-1),303072:(6,5,False,1)} # baseline level,candidate level,vul,NS orientation
          rows=[]; B=W=E=0; net=0
          for idx,(bl,cl,vul,orient) in specs.items():
            tricks,par=data[idx]; bs=score(bl,tricks,vul)*orient; cs=score(cl,tricks,vul)*orient
            bg=abs(bs-par); cg=abs(cs-par); d=cg-bg; v='BETTER' if d<0 else 'WORSE' if d>0 else 'EQUIVALENT'
            B+=v=='BETTER'; W+=v=='WORSE'; E+=v=='EQUIVALENT'; net+=d
            rows.append({'index':idx,'dds_tricks':tricks,'baseline_ns_score':bs,'candidate_ns_score':cs,'dealer_par_ns_score':par,'baseline_gap':bg,'candidate_gap':cg,'gap_delta':d,'verdict':v})
          status='GREEN' if W==0 and net<=0 else 'REJECTED'
          out={'status':status,'scope':'MB09-RC09 exact S4-H3-D5-C1 / 21 HLD -> direct fitted 2NT','fresh_deals':500000,'fresh_master_seed':1005000000001,'exhaustive_feature_prefilter_candidates':346,'target_occurrences':2,'changed_contracts':2,'BETTER':B,'WORSE':W,'EQUIVALENT':E,'net_dds_gap_delta':net,'historical_500k_targeted':5,'historical_verdicts_before_patch':{'BETTER':0,'WORSE':4,'EQUIVALENT':1},'historical_old_gap_delta':2440,'candidate_critic_sha256':os.environ['CANDIDATE_CRITIC_SHA256'],'dds_runtime_sha256':os.environ['DDS_A_SHA256'],'rows':rows}
          json.dump(out,open('results/mb09-rc09-h3d5c1/FRESH_500K_TRUE_DDS_DIAGNOSTIC.json','w'),indent=2); print(json.dumps(out,indent=2))
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add results/mb09-rc09-h3d5c1/FRESH_500K_TRUE_DDS_DIAGNOSTIC.json
          git diff --cached --quiet || git commit -m 'Record MB09 RC09 H3D5C1 fresh 500K true DDS diagnostic'
          git push
