name: Preflight MB02 500K

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/preflight-mb02-500k.yml"

permissions:
  contents: write

env:
  PACKAGE: PONS_R7_FIXED_MB01_D9_GATE_PACKAGE.zip
  R7_CRITIC_SHA: f1991fba7f818668aa55ab1776c63afd6b4f52b3b8a9565b599bc44ec236ca85
  MB01_CRITIC_SHA: 52d548cdd5c41206e89c1d970e12c663850b0955f6157da03bd938dae0df59c8
  MB02_CRITIC_SHA: 6f236dcb597ec5502b44e7e66cd79515051be5268de9f9d010fd621dea8b0511
  SEED: "998000000001"

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact MB02 robustly
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir -p work/pkg work/r7zip work/mb01 work/mb02
          unzip -q "$PACKAGE" -d work/pkg
          cd work/pkg
          sha256sum -c SHA256SUMS.txt
          unzip -q R7_GREEN.zip -d ../r7zip
          R7_RUNTIME="$(dirname "$(find ../r7zip -type f -name pons-critic.js | head -1)")"
          test -n "$R7_RUNTIME"
          test "$(sha256sum "$R7_RUNTIME/pons-critic.js" | awk '{print $1}')" = "$R7_CRITIC_SHA"
          cp -a "$R7_RUNTIME"/. ../mb01/
          cp MB01_pons-critic.js ../mb01/pons-critic.js
          test "$(sha256sum ../mb01/pons-critic.js | awk '{print $1}')" = "$MB01_CRITIC_SHA"
          cp -a ../mb01/. ../mb02/
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mb02/pons-critic.js')
          lines=p.read_text().splitlines(True)
          hits=[]
          for i in range(len(lines)-7):
              if ('const s=exact5[0], target=`1${s}`;' in lines[i]
                  and "const vulState=String(ctx.deal?.vulnerable||'None'), ownSide=sideOf(seat);" in lines[i+1]
                  and "const ownVul=vulState==='Both'||vulState===ownSide;" in lines[i+2]
                  and 'const floor=ownVul?10:8;' in lines[i+3]
                  and "instance-d-wave2-d13-vulnerability-one-level-overcall" in lines[i+5]
                  and "instance-d-wave2-d13-vulnerability-one-level-overcall" in lines[i+7]):
                  hits.append(i)
          if len(hits)!=1:
              raise SystemExit(f'D13 semantic block hits={hits}')
          i=hits[0]
          indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
          child=indent+'  '
          new=[
              f"{indent}const s=exact5[0], target=`1${{s}}`;\n",
              f"{indent}const vulState=String(ctx.deal?.vulnerable||'None'), ownSide=sideOf(seat);\n",
              f"{indent}const ownVul=vulState==='Both'||vulState===ownSide;\n",
              f"{indent}const oldFloor=ownVul?10:8;\n",
              f"{indent}const floor=ownVul?12:11;\n",
              f"{indent}if(HL>=floor && legal(target))\n",
              f"{child}return out(target,'instance-d-wave2-d13-vulnerability-one-level-overcall',`WAVE2 D13 : ${{target}} naturel, couleur 5e et ${{HL}} HL ; seuil PONS FIXED ${{floor}} HL (${{ownVul?'vulnérable':'non vulnérable'}})`,{{suits:{{[s]:{{min:5,max:5}}}},points:{{min:floor,max:11}},vulnerabilitySensitive:true}});\n",
              f"{indent}if(HL<floor && legal('PASS')){{\n",
              f"{child}const source=HL>=oldFloor?'r7-fixed-mb02-d13-tighten-vulnerability-one-level-overcall':'instance-d-wave2-d13-vulnerability-one-level-overcall';\n",
              f"{child}return out('PASS',source,`R7 FIXED MB02 D13 : ${{HL}} HL sous le seuil ${{floor}} HL ${{ownVul?'vulnérable':'non vulnérable'}} => Passe`,{{natural:false,points:{{min:8,max:floor-1}},vulnerabilitySensitive:true}});\n",
              f"{indent}}}\n",
          ]
          lines[i:i+8]=new
          p.write_text(''.join(lines))
          PY
          node --check mb02/pons-critic.js
          test "$(sha256sum mb02/pons-critic.js | awk '{print $1}')" = "$MB02_CRITIC_SHA"
          echo "MB01_RUNTIME=$(realpath mb01)" >> "$GITHUB_ENV"
          echo "MB02_RUNTIME=$(realpath mb02)" >> "$GITHUB_ENV"
          echo "PKG=$(realpath pkg)" >> "$GITHUB_ENV"

      - name: Generate 1K fresh smoke deals
        id: generate
        run: |
          python3 "$PKG/GENERATOR.py" work/deals.jsonl 1000 "$SEED"
          test "$(wc -l < work/deals.jsonl)" -eq 1000

      - name: Run MB01 and MB02
        id: runengines
        run: |
          node "$PKG/GATE_RUNNER_FIXED.mjs" "$MB01_RUNTIME" work/deals.jsonl work/mb01.jsonl
          node "$PKG/GATE_RUNNER_FIXED.mjs" "$MB02_RUNTIME" work/deals.jsonl work/mb02.jsonl
          test "$(wc -l < work/mb01.jsonl)" -eq 1000
          test "$(wc -l < work/mb02.jsonl)" -eq 1000

      - name: Verify every change is exact D13
        id: verify
        run: |
          python3 - <<'PY'
          import json
          def load(p):
              d={}
              with open(p) as f:
                  for line in f:
                      x=json.loads(line); d[(int(x['index_global']),int(x['seed']))]=x
              return d
          A=load('work/mb01.jsonl'); B=load('work/mb02.jsonl')
          assert A.keys()==B.keys() and len(A)==1000
          changed=exact=0; bad=[]
          for k,a in A.items():
              b=B[k]
              if a['auction']==b['auction']:
                  continue
              changed+=1
              n=min(len(a['auction']),len(b['auction']))
              i=next((j for j in range(n) if a['auction'][j]!=b['auction'][j]),n)
              am=next((m for m in a.get('marks',[]) if m.get('i')==i),None)
              bm=next((m for m in b.get('marks',[]) if m.get('i')==i),None)
              ok=(i<n and am and am.get('reviewedSource')=='instance-d-wave2-d13-vulnerability-one-level-overcall'
                  and a['auction'][i] in ('1D','1H','1S') and b['auction'][i]=='PASS'
                  and bm and bm.get('reviewedSource')=='r7-fixed-mb02-d13-tighten-vulnerability-one-level-overcall')
              if ok: exact+=1
              else: bad.append((k,i,a['auction'][i] if i<len(a['auction']) else None,b['auction'][i] if i<len(b['auction']) else None,am,bm))
          assert changed>0, 'preflight observed no MB02 changes'
          assert exact==changed and not bad, bad[:5]
          print({'status':'PREFLIGHT_PASS','deals':1000,'changed':changed,'exact_d13':exact,'collateral':0})
          PY

      - name: Commit preflight status
        if: always()
        env:
          RECONSTRUCT: ${{ steps.reconstruct.outcome }}
          GENERATE: ${{ steps.generate.outcome }}
          RUNENGINES: ${{ steps.runengines.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          mkdir -p results/preflight-mb02-500k
          python3 - <<'PY'
          import json,os
          steps={k:os.environ[k] for k in ('RECONSTRUCT','GENERATE','RUNENGINES','VERIFY')}
          status='PREFLIGHT_PASS' if all(v=='success' for v in steps.values()) else 'PREFLIGHT_FAIL'
          json.dump({'status':status,'steps':steps,'mb02_critic_sha256':os.environ['MB02_CRITIC_SHA'],'seed':os.environ['SEED']},open('results/preflight-mb02-500k/STATUS.json','w'),indent=2)
          print(status,steps)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preflight-mb02-500k/STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m "Record MB02 500K preflight status"
          git push origin HEAD:main
