name: Final compare v2.61 vs R7 FIXED MB06 - fresh 500K + true DDS

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/compare-v261-mb06-final-500k-dds.yml"

permissions:
  contents: write

env:
  CAMPAIGN: PONS_CMP500K_V261_VS_R7_GREEN_FIXED_CAMPAIGN.zip
  MB01_PACKAGE: PONS_R7_FIXED_MB01_D9_GATE_PACKAGE.zip
  BASELINE_ZIP_SHA: 718974c8cb2159898b93b2fc93111509f96b145b99e9af3d62559b7fbf5c80b5
  R7_CRITIC_SHA: f1991fba7f818668aa55ab1776c63afd6b4f52b3b8a9565b599bc44ec236ca85
  MB01_CRITIC_SHA: 52d548cdd5c41206e89c1d970e12c663850b0955f6157da03bd938dae0df59c8
  MB02_CRITIC_SHA: 6f236dcb597ec5502b44e7e66cd79515051be5268de9f9d010fd621dea8b0511
  MB03_CRITIC_SHA: 7f8c10371be03ed35729f7ca0adbd8a374ebd01afed90aa987fc94ae4e02d35a
  MB04_CRITIC_SHA: 0838c8bba44bea70a7faf719d180683de45c7d5a8c5753483eed5bbdd68c7e8c
  MB05_CRITIC_SHA: cd3ff1ef67e4848b14f526cf0de0c929f9b3df856e0d847b7a37002cf1898468
  MB06_CRITIC_SHA: 6f74d0d55ecf63e8679c21b5f46fc50a48545f9d41cdcc4f26cc51dec4db701c
  GENERATOR_SHA: cb45c4d7c450bb674d9f984cc077f566a4f596b0e6db9ba3734cd94c94a0b457
  RUNNER_SHA: 87cf2b70a9a54dc7df1bffe3dac418783f030b91cc31e75eadae672cc7c51869
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c

jobs:
  shard:
    name: final ${{ matrix.shard }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: S1, seed: 1000500000001, deals_sha256: 9d4098ed68784b6f9dbc94a25b1993322b3af87817acdb7228791a72ff3effb8 }
          - { shard: S2, seed: 1000600000001, deals_sha256: 23094e44f00d82cdfb37917b58e033915209556514d7a8c0c7bf2627c746193b }
          - { shard: S3, seed: 1000700000001, deals_sha256: 72e35f867606bbb3993e63f39fff92badf40c894af156f8284983fc67669835d }
          - { shard: S4, seed: 1000800000001, deals_sha256: fe36da60f8b6b43005989b4592bac31036cbde550a27345d2e819684ddb862dd }
          - { shard: S5, seed: 1000900000001, deals_sha256: e8379ee47d2191149f20fc1b35385d6bdc84a21493a8202aa4b97b2a89334a97 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Reconstruct exact baseline and MB06
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CAMPAIGN" && test -s "$MB01_PACKAGE"
          rm -rf work && mkdir -p work/campaign work/mb01pkg work/base work/r7zip work/mb01 work/mb02 work/mb03 work/mb04 work/mb05 work/mb06
          unzip -q "$CAMPAIGN" -d work/campaign
          unzip -q "$MB01_PACKAGE" -d work/mb01pkg
          PKG=work/campaign/CMP500K_FIXED_PACKAGE
          test "$(sha256sum "$PKG/BASELINE_V261_ORIGINAL.zip" | awk '{print $1}')" = "$BASELINE_ZIP_SHA"
          test "$(sha256sum "$PKG/GENERATOR.py" | awk '{print $1}')" = "$GENERATOR_SHA"
          test "$(sha256sum "$PKG/GATE_RUNNER_FIXED.mjs" | awk '{print $1}')" = "$RUNNER_SHA"
          unzip -q "$PKG/BASELINE_V261_ORIGINAL.zip" -d work/base
          unzip -q work/mb01pkg/R7_GREEN.zip -d work/r7zip
          R7_RUNTIME="$(dirname "$(find work/r7zip -type f -name pons-critic.js | head -1)")"
          BASE_RUNTIME="$(dirname "$(find work/base -type f -path '*/play/pons-critic.js' | head -1)")"
          test -n "$R7_RUNTIME" && test -n "$BASE_RUNTIME"
          test "$(sha256sum "$R7_RUNTIME/pons-critic.js" | awk '{print $1}')" = "$R7_CRITIC_SHA"
          cp -a "$R7_RUNTIME"/. work/mb01/
          cp work/mb01pkg/MB01_pons-critic.js work/mb01/pons-critic.js
          test "$(sha256sum work/mb01/pons-critic.js | awk '{print $1}')" = "$MB01_CRITIC_SHA"
          cp -a work/mb01/. work/mb02/
          (cd work && patch --batch --forward mb02/pons-critic.js < ../tools/MB01_TO_MB02_D13.patch)
          test "$(sha256sum work/mb02/pons-critic.js | awk '{print $1}')" = "$MB02_CRITIC_SHA"
          cp -a work/mb02/. work/mb03/
          (cd work && patch --batch --forward mb03/pons-critic.js < ../tools/MB02_TO_MB03_BRANCHK.patch)
          test "$(sha256sum work/mb03/pons-critic.js | awk '{print $1}')" = "$MB03_CRITIC_SHA"
          cp -a work/mb03/. work/mb04/
          (cd work && patch --batch --forward mb04/pons-critic.js < ../tools/MB03_TO_MB04_DELAYED_SPADES_RKCB.patch)
          test "$(sha256sum work/mb04/pons-critic.js | awk '{print $1}')" = "$MB04_CRITIC_SHA"
          cp -a work/mb04/. work/mb05/
          (cd work && patch --batch --forward mb05/pons-critic.js < ../tools/MB04_TO_MB05_DELAYED_HEARTS_RKCB.patch)
          test "$(sha256sum work/mb05/pons-critic.js | awk '{print $1}')" = "$MB05_CRITIC_SHA"
          cp -a work/mb05/. work/mb06/
          (cd work && patch --batch --forward mb06/pons-critic.js < ../tools/MB05_TO_MB06_O2_SIXCARD_ROLLBACK.patch)
          test "$(sha256sum work/mb06/pons-critic.js | awk '{print $1}')" = "$MB06_CRITIC_SHA"
          node --check work/mb06/pons-critic.js
          echo "PKG=$(realpath "$PKG")" >> "$GITHUB_ENV"
          echo "BASE_RUNTIME=$(realpath "$BASE_RUNTIME")" >> "$GITHUB_ENV"
          echo "MB06_RUNTIME=$(realpath work/mb06)" >> "$GITHUB_ENV"

      - name: Generate fresh 100K and run both engines
        run: |
          set -euo pipefail
          python3 "$PKG/GENERATOR.py" work/deals.jsonl 100000 "${{ matrix.seed }}"
          test "$(wc -l < work/deals.jsonl)" -eq 100000
          echo "${{ matrix.deals_sha256 }}  work/deals.jsonl" | sha256sum -c -
          node "$PKG/GATE_RUNNER_FIXED.mjs" "$BASE_RUNTIME" work/deals.jsonl work/v261.jsonl
          node "$PKG/GATE_RUNNER_FIXED.mjs" "$MB06_RUNTIME" work/deals.jsonl work/mb06.jsonl
          test "$(wc -l < work/v261.jsonl)" -eq 100000
          test "$(wc -l < work/mb06.jsonl)" -eq 100000

      - name: Build changed-contract DDS input and raw differences
        run: |
          SHARD="${{ matrix.shard }}" python3 - <<'PY'
          import json,os
          shard=os.environ['SHARD']
          def load(p):
            d={}
            with open(p) as f:
              for line in f:
                x=json.loads(line); d[(int(x['index_global']),int(x['seed']))]=x
            return d
          deals=load('work/deals.jsonl'); a=load('work/v261.jsonl'); b=load('work/mb06.jsonl')
          assert deals.keys()==a.keys()==b.keys() and len(a)==100000
          def pbn(hands):
            def s(h,su): return hands[h].get(su,'') or '-'
            return 'N:'+' '.join('.'.join(s(h,su) for su in ('S','H','D','C')) for h in ('N','E','S','W'))
          def cf(c):
            if c.get('passout'): return ['1','0','-','-','NONE']
            return ['0',str(c['level']),str(c['strain']).replace('NT','N'),c['declarer'],c.get('doubling','NONE')]
          same=diff=auction_only=contract_changed=0
          raw=open(f'work/{shard}_RAW_DIFFERENCES.jsonl','w'); dds=open(f'work/{shard}_DDS_INPUT.tsv','w')
          for k in sorted(a):
            x,y=a[k],b[k]
            if x['auction']==y['auction']:
              same+=1; continue
            diff+=1
            cc=x['contract']!=y['contract']
            if cc:
              contract_changed+=1; d=deals[k]
              dds.write('\t'.join([shard,str(k[0]),str(k[1]),d['dealer'],d['vulnerability'],pbn(d['hands']),*cf(x['contract']),*cf(y['contract'])])+'\n')
            else: auction_only+=1
            n=min(len(x['auction']),len(y['auction']))
            i=next((j for j in range(n) if x['auction'][j]!=y['auction'][j]),n)
            def mark(ms): return next((m for m in ms if m.get('i')==i),None)
            root=(mark(y.get('marks',[])) or mark(x.get('marks',[])) or {}).get('reviewedSource') or 'UNMARKED'
            raw.write(json.dumps({'shard':shard,'index_global':k[0],'seed':k[1],'first_divergence_ply':i,'root_cause':root,'contract_changed':cc,'baseline_contract':x['contract'],'candidate_contract':y['contract']},separators=(',',':'))+'\n')
          raw.close(); dds.close()
          s={'shard':shard,'seed':int('${{ matrix.seed }}'),'deals':100000,'same':same,'differences':diff,'auction_only_same_contract':auction_only,'contract_changed':contract_changed}
          assert same+diff==100000 and auction_only+contract_changed==diff
          json.dump(s,open(f'work/{shard}_RAW_SUMMARY.json','w'),indent=2,sort_keys=True)
          print(json.dumps(s,indent=2))
          PY

      - name: Build pinned true DDS
        run: |
          set -euo pipefail
          git clone -q https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout -q "$ODIN_COMMIT"
          test "$(git -C odin-dds rev-parse HEAD)" = "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -s -C odin-dds/src
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"
          cat > dds_batch.cpp <<'CPP'
          #include <algorithm>
          #include <cstring>
          #include <fstream>
          #include <iostream>
          #include <string>
          #include <vector>
          #include "dll.h"
          struct C{bool po{};int l{};char s{'-'};char d{'-'};std::string x{"NONE"};};
          struct R{std::string sh;long long i{};unsigned long long seed{};char dealer{};std::string vul,pbn;C a,b;};
          static std::vector<std::string> sp(const std::string&s){std::vector<std::string>v;size_t p=0;for(;;){auto q=s.find('\t',p);if(q==std::string::npos){v.push_back(s.substr(p));break;}v.push_back(s.substr(p,q-p));p=q+1;}return v;}
          static int hc(char c){return c=='N'?0:c=='E'?1:c=='S'?2:3;} static int sc(char c){return c=='S'?0:c=='H'?1:c=='D'?2:c=='C'?3:4;} static int vc(const std::string&v){return v=="None"?0:v=="Both"?1:v=="NS"?2:3;}
          static bool iv(char d,int v){if(v==1)return true;if(v==0)return false;bool ns=d=='N'||d=='S';return v==2?ns:!ns;}
          static int ds(const C&c,int t,int v){if(c.po)return 0;int tar=c.l+6,del=t-tar;bool vu=iv(c.d,v);int m=c.x=="XX"?4:c.x=="X"?2:1;if(del>=0){int base=(c.s=='C'||c.s=='D')?20*c.l:(c.s=='H'||c.s=='S')?30*c.l:40+30*(c.l-1);int cp=base*m,z=cp;if(m==2)z+=50;else if(m==4)z+=100;if(del>0){if(m==1)z+=del*((c.s=='C'||c.s=='D')?20:30);else if(m==2)z+=del*(vu?200:100);else z+=del*(vu?400:200);}z+=cp>=100?(vu?500:300):50;if(c.l==6)z+=vu?750:500;else if(c.l==7)z+=vu?1500:1000;return z;}int u=-del,pen;if(m==1)pen=u*(vu?100:50);else{int q;if(vu)q=200+(u-1)*300;else q=u==1?100:u==2?300:u==3?500:500+(u-3)*300;pen=q*(m==4?2:1);}return -pen;}
          static int ns(const C&c,int t,int v){int z=ds(c,t,v);return c.po?0:((c.d=='N'||c.d=='S')?z:-z);} 
          int main(int ac,char**av){if(ac<3)return 2;std::ifstream in(av[1]);std::ofstream out(av[2]);std::vector<R>rs;std::string line;while(std::getline(in,line)){if(line.empty())continue;auto f=sp(line);if(f.size()!=16)return 3;R r;r.sh=f[0];r.i=std::stoll(f[1]);r.seed=std::stoull(f[2]);r.dealer=f[3][0];r.vul=f[4];r.pbn=f[5];auto pc=[&](int o,C&c){c.po=f[o]=="1";c.l=std::stoi(f[o+1]);c.s=f[o+2][0];c.d=f[o+3][0];c.x=f[o+4];};pc(6,r.a);pc(11,r.b);rs.push_back(r);}SetMaxThreads(0);int filter[5]={0,0,0,0,0};long long err=0;const size_t B=40;for(size_t base=0;base<rs.size();base+=B){size_t n=std::min(B,rs.size()-base);ddTableDealsPBN deals{};deals.noOfTables=(int)n;for(size_t j=0;j<n;j++)std::strncpy(deals.deals[j].cards,rs[base+j].pbn.c_str(),sizeof(deals.deals[j].cards)-1);ddTablesRes res{};allParResults pars{};int rc=CalcAllTablesPBN(&deals,-1,filter,&res,&pars);if(rc!=RETURN_NO_FAULT)return 4;for(size_t j=0;j<n;j++){auto&r=rs[base+j];auto&t=res.results[j];int v=vc(r.vul);int ta=r.a.po?0:t.resTable[sc(r.a.s)][hc(r.a.d)],tb=r.b.po?0:t.resTable[sc(r.b.s)][hc(r.b.d)];int sa=ns(r.a,ta,v),sb=ns(r.b,tb,v);parResultsDealer pr{};int prc=DealerPar(const_cast<ddTableResults*>(&t),&pr,hc(r.dealer),v);if(prc!=RETURN_NO_FAULT){err++;continue;}out<<r.sh<<'\t'<<r.i<<'\t'<<r.seed<<'\t'<<ta<<'\t'<<sa<<'\t'<<tb<<'\t'<<sb<<'\t'<<pr.score<<'\n';}}FreeMemory();return err?5:0;}
          CPP
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include dds_batch.cpp odin-dds/lib/dds.a -pthread -o dds_batch

      - name: Solve DDS and classify shard
        run: |
          set -euo pipefail
          ./dds_batch "work/${{ matrix.shard }}_DDS_INPUT.tsv" "work/${{ matrix.shard }}_DDS.tsv"
          test "$(wc -l < work/${{ matrix.shard }}_DDS.tsv)" = "$(wc -l < work/${{ matrix.shard }}_DDS_INPUT.tsv)"
          SHARD="${{ matrix.shard }}" python3 - <<'PY'
          import collections,json,os
          sh=os.environ['SHARD']; dds={}
          with open(f'work/{sh}_DDS.tsv') as f:
            for l in f:
              z=l.rstrip().split('\t'); dds[(int(z[1]),int(z[2]))]=dict(ta=int(z[3]),sa=int(z[4]),tb=int(z[5]),sb=int(z[6]),par=int(z[7]))
          cnt=collections.Counter(); roots={}; gap=0; rows=0
          out=open(f'work/{sh}_CLASSIFICATIONS.jsonl','w')
          with open(f'work/{sh}_RAW_DIFFERENCES.jsonl') as f:
            for l in f:
              x=json.loads(l); rows+=1
              if x['contract_changed']:
                q=dds[(x['index_global'],x['seed'])]; ga=abs(q['sa']-q['par']); gb=abs(q['sb']-q['par']); delta=gb-ga; gap+=delta
                v='BETTER' if delta<0 else 'WORSE' if delta>0 else 'EQUIVALENT'
                x['dds']={**q,'baseline_gap':ga,'candidate_gap':gb,'gap_delta':delta}
              else: v='EQUIVALENT'; delta=0; x['dds']=None
              cnt[v]+=1; r=roots.setdefault(x['root_cause'],{'differences':0,'BETTER':0,'WORSE':0,'EQUIVALENT':0,'net_dds_impact':0}); r['differences']+=1;r[v]+=1;r['net_dds_impact']+=delta
              out.write(json.dumps({'verdict':v,**x},separators=(',',':'))+'\n')
          out.close(); s=json.load(open(f'work/{sh}_RAW_SUMMARY.json')); assert rows==s['differences'] and len(dds)==s['contract_changed']
          s.update({'BETTER':cnt['BETTER'],'WORSE':cnt['WORSE'],'EQUIVALENT':cnt['EQUIVALENT'],'gap_delta':gap,'roots':roots,'candidate_critic_sha256':os.environ['MB06_CRITIC_SHA'],'status':'SHARD_COMPLETE_TRUE_DDS'})
          json.dump(s,open(f'work/{sh}_FINAL_SUMMARY.json','w'),indent=2,sort_keys=True)
          PY
          gzip -9 "work/${{ matrix.shard }}_CLASSIFICATIONS.jsonl"

      - uses: actions/upload-artifact@v4
        with:
          name: mb06-final-${{ matrix.shard }}
          path: |
            work/${{ matrix.shard }}_FINAL_SUMMARY.json
            work/${{ matrix.shard }}_CLASSIFICATIONS.jsonl.gz
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: shard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mb06-final-*
          path: incoming
          merge-multiple: true
      - name: Aggregate final 500K verdict
        run: |
          mkdir -p final
          python3 - <<'PY'
          import collections,glob,gzip,json,os
          ss=[json.load(open(p)) for p in sorted(glob.glob('incoming/S*_FINAL_SUMMARY.json'))]; assert len(ss)==5
          keys=['deals','same','differences','auction_only_same_contract','contract_changed','BETTER','WORSE','EQUIVALENT','gap_delta']
          t={k:sum(int(s[k]) for s in ss) for k in keys}; assert t['deals']==500000 and t['same']+t['differences']==500000 and t['auction_only_same_contract']+t['contract_changed']==t['differences']
          roots={}
          for s in ss:
            for k,v in s['roots'].items():
              r=roots.setdefault(k,{'differences':0,'BETTER':0,'WORSE':0,'EQUIVALENT':0,'net_dds_impact':0})
              for q in r:r[q]+=int(v[q])
          verdict='DEMONSTRATED_SUPERIOR' if t['gap_delta']<0 and t['BETTER']>t['WORSE'] else ('DEMONSTRATED_INFERIOR' if t['gap_delta']>0 and t['WORSE']>t['BETTER'] else 'MIXED_NOT_DEMONSTRATED')
          summary={'campaign':'PONS_FINAL_CMP500K_V261_VS_R7_FIXED_MB06_FRESH','status':'COMPLETE_TRUE_DDS_500K','verdict':verdict,'baseline':'PONS_v2.61_ORIGINAL','candidate':'R7_FIXED_MB06_D9_D13_BRANCHK_DELAYED_SPADES_DELAYED_HEARTS_O2_SIXCARD','candidate_critic_sha256':'6f74d0d55ecf63e8679c21b5f46fc50a48545f9d41cdcc4f26cc51dec4db701c','dds_runtime_sha256':'e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c',**t,'better_minus_worse':t['BETTER']-t['WORSE'],'mean_gap_delta_per_changed_contract':t['gap_delta']/t['contract_changed'] if t['contract_changed'] else 0,'shards':ss}
          json.dump(summary,open('final/FINAL_SUMMARY.json','w'),indent=2,sort_keys=True)
          json.dump(dict(sorted(roots.items(),key=lambda kv:kv[1]['net_dds_impact'],reverse=True)),open('final/ROOT_CAUSE_AGGREGATES.json','w'),indent=2,sort_keys=True)
          with open('final/FINAL_REPORT.md','w') as f:
            f.write('# FINAL — v2.61 original vs R7 FIXED MB06 — fresh 500K + true DDS\n\n')
            f.write(f"**Verdict: `{verdict}`**\n\n- Deals: **{t['deals']:,}**\n- Same auctions: **{t['same']:,}**\n- Changed auctions: **{t['differences']:,}**\n- Changed final contracts: **{t['contract_changed']:,}**\n- True DDS + DealerPar: **{t['contract_changed']:,}/{t['contract_changed']:,}**\n- BETTER: **{t['BETTER']:,}**\n- WORSE: **{t['WORSE']:,}**\n- EQUIVALENT: **{t['EQUIVALENT']:,}**\n- BETTER - WORSE: **{t['BETTER']-t['WORSE']:+,}**\n- Candidate - baseline absolute DealerPar gap: **{t['gap_delta']:+,}**\n\nNegative gap means MB06 is closer to DealerPar. Same exact final contract is EQUIVALENT.\n")
          print(json.dumps(summary,indent=2))
          PY
          gzip -cd incoming/S1_CLASSIFICATIONS.jsonl.gz incoming/S2_CLASSIFICATIONS.jsonl.gz incoming/S3_CLASSIFICATIONS.jsonl.gz incoming/S4_CLASSIFICATIONS.jsonl.gz incoming/S5_CLASSIFICATIONS.jsonl.gz | gzip -9 > final/FINAL_CLASSIFICATIONS.jsonl.gz
          (cd final && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PONS_FINAL_CMP500K_V261_VS_R7_FIXED_MB06_DDS_COMPLETE
          path: final/
          retention-days: 30
      - name: Commit compact final result
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p results/final-cmp500k-v261-vs-mb06
          cp final/FINAL_SUMMARY.json final/FINAL_REPORT.md final/ROOT_CAUSE_AGGREGATES.json final/SHA256SUMS.txt results/final-cmp500k-v261-vs-mb06/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/final-cmp500k-v261-vs-mb06
          if ! git diff --cached --quiet; then
            git commit -m "Add final v2.61 vs MB06 fresh 500K DDS result"
            git push origin HEAD:main
          fi
