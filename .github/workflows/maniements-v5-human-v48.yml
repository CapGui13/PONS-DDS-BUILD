name: MANIEMENTS V5 — Human V4.8 novel auto review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "maniements-v5/dictionary/HUMAN_V48_START"

permissions:
  contents: read

concurrency:
  group: maniements-v5-human-v48
  cancel-in-progress: true

jobs:
  novel-review:
    name: Build 10 genuinely novel automatic cases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify frozen V5 runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/MANIEMENTS_V3_GENERATION_V5_PASS_ORBIT_RUNTIME_V2.zip"
          EXPECTED="a0b580531f3c9e8bb00710b9c3e1c183b27cbfe9231c9d584e29a374ba88835d"
          cat \
            maniements-v5/runtime/runtime_v2.b64.part-00 \
            maniements-v5/runtime/runtime_v2.b64.part-01 \
            maniements-v5/runtime/runtime_v2.b64.part-02a \
            maniements-v5/runtime/runtime_v2.b64.part-02b \
            maniements-v5/runtime/runtime_v2.b64.part-03 \
            maniements-v5/runtime/runtime_v2.b64.part-04 \
            maniements-v5/runtime/runtime_v2.b64.part-05 \
            maniements-v5/runtime/runtime_v2.b64.part-06 \
            | base64 -d > "$ZIP"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECTED"
          mkdir -p "$RUNNER_TEMP/v5-runtime"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/v5-runtime"
          (cd "$RUNNER_TEMP/v5-runtime" && sha256sum -c SHA256SUMS.txt)

      - name: Generate 10 novel automatic cases
        shell: bash
        run: |
          set -euo pipefail
          python3 maniements-v5/dictionary/human_novel_v481.py \
            --runtime-root "$RUNNER_TEMP/v5-runtime" \
            --reference maniements-v5/dictionary/human_reference_cases_v4.json \
            --out-dir dist

      - name: Add summary
        shell: bash
        run: |
          echo '## Human V4.8.1 — 10 genuinely novel cases' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- no human reference answer is supplied to these cases' >> "$GITHUB_STEP_SUMMARY"
          echo '- exact frozen runtime is verified before generation' >> "$GITHUB_STEP_SUMMARY"
          echo '- output is deliberately marked AUTO, NON RELU' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: MANIEMENTS_V5_HUMAN_V481_10_NOUVEAUX
          path: dist/*
          if-no-files-found: error
          retention-days: 30
