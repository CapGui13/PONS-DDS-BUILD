name: Complete MB02 D13 DDS 133

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "MB02_D13_133_KEYS.tsv"
      - ".github/workflows/complete-mb02-d13-dds.yml"

permissions:
  contents: write

env:
  ODIN_COMMIT: 38fcd537dd6c7dec7ef596e861551f1b278f2f98
  DDS_UPSTREAM_COMMIT: 7219c956f4ed9a9f8d1585e9a1a2c57465745ac5
  DDS_A_SHA256: e5c7bcdcf96d3ed24b14b2840303a0d0936b05419de463809f68982c565c7f4c
  EXPECTED_ROWS: "133"
  V261_CRITIC_SHA: c6a1a349befceb2a302276179127a7900aeddace80cf3d54af55ff7e3f457bb7
  MB01_CRITIC_SHA: 52d548cdd5c41206e89c1d970e12c663850b0955f6157da03bd938dae0df59c8
  MB02_CRITIC_SHA: 6f236dcb597ec5502b44e7e66cd79515051be5268de9f9d010fd621dea8b0511
  KNOWN_13655_NET: "-61290"
  ORIGINAL_D13_NET: "235780"

jobs:
  solve:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned true DDS
        run: |
          set -euo pipefail
          git clone https://github.com/enerqi/odin-dds.git odin-dds
          git -C odin-dds checkout "$ODIN_COMMIT"
          test "$(git -C odin-dds rev-parse HEAD)" = "$ODIN_COMMIT"
          grep -q "$DDS_UPSTREAM_COMMIT" odin-dds/external/dds/VENDORED.md
          make -C odin-dds/src
          test -s odin-dds/lib/dds.a
          test "$(sha256sum odin-dds/lib/dds.a | awk '{print $1}')" = "$DDS_A_SHA256"

      - name: Unpack comparison runtimes
        run: |
          set -euo pipefail
          rm -rf work && mkdir -p work/campaign work/pkg
          unzip -q PONS_CMP500K_V261_VS_R7_GREEN_FIXED_CAMPAIGN.zip -d work/campaign
          CAMP=work/campaign/CMP500K_FIXED_PACKAGE
          test "$(sha256sum "$CAMP/GATE_RUNNER_FIXED.mjs" | awk '{print $1}')" = "87cf2b70a9a54dc7df1bffe3dac418783f030b91cc31e75eadae672cc7c51869"
          unzip -q "$CAMP/BASELINE_V261_ORIGINAL.zip" -d work/v261zip
          V261_RUNTIME="$(dirname "$(find work/v261zip -type f -path '*/play/pons-critic.js' | head -1)")"
          V261_RUNTIME="$(realpath "$V261_RUNTIME")"
          test "$(sha256sum "$V261_RUNTIME/pons-critic.js" | awk '{print $1}')" = "$V261_CRITIC_SHA"

          unzip -q PONS_R7_FIXED_MB01_D9_GATE_PACKAGE.zip -d work/pkg
          unzip -q work/pkg/R7_GREEN.zip -d work/r7zip
          R7_RUNTIME="$(dirname "$(find work/r7zip -type f -name pons-critic.js | head -1)")"
          R7_RUNTIME="$(realpath "$R7_RUNTIME")"
          cp -a "$R7_RUNTIME" work/mb01
          cp work/pkg/MB01_pons-critic.js work/mb01/pons-critic.js
          test "$(sha256sum work/mb01/pons-critic.js | awk '{print $1}')" = "$MB01_CRITIC_SHA"
          cp -a work/mb01 work/mb02

          python - <<'PY'
          from pathlib import Path
          p=Path('work/mb02/pons-critic.js')
          s=p.read_text()
          old="""        const s=exact5[0], target=`1${s}`;
                  const vulState=String(ctx.deal?.vulnerable||'None'), ownSide=sideOf(seat);
                  const ownVul=vulState==='Both'||vulState===ownSide;
                  const floor=ownVul?10:8;
                  if(HL>=floor && legal(target))
                    return out(target,'instance-d-wave2-d13-vulnerability-one-level-overcall',`WAVE2 D13 : ${target} naturel, couleur 5e et ${HL} HL ; seuil PONS ${floor} HL (${ownVul?'vulnérable':'non vulnérable'})`,{suits:{[s]:{min:5,max:5}},points:{min:floor,max:11},vulnerabilitySensitive:true});
                  if(HL<floor && legal('PASS'))
                    return out('PASS','instance-d-wave2-d13-vulnerability-one-level-overcall',`WAVE2 D13 : ${HL} HL sous le seuil PONS ${floor} HL ${ownVul?'vulnérable':'non vulnérable'} => Passe`,{natural:false,points:{min:8,max:floor-1},vulnerabilitySensitive:true});
          """
          new="""        const s=exact5[0], target=`1${s}`;
                  const vulState=String(ctx.deal?.vulnerable||'None'), ownSide=sideOf(seat);
                  const ownVul=vulState==='Both'||vulState===ownSide;
                  const oldFloor=ownVul?10:8;
                  const floor=ownVul?12:11;
                  if(HL>=floor && legal(target))
                    return out(target,'instance-d-wave2-d13-vulnerability-one-level-overcall',`WAVE2 D13 : ${target} naturel, couleur 5e et ${HL} HL ; seuil PONS FIXED ${floor} HL (${ownVul?'vulnérable':'non vulnérable'})`,{suits:{[s]:{min:5,max:5}},points:{min:floor,max:11},vulnerabilitySensitive:true});
                  if(HL<floor && legal('PASS')){
                    const source=HL>=oldFloor?'r7-fixed-mb02-d13-tighten-vulnerability-one-level-overcall':'instance-d-wave2-d13-vulnerability-one-level-overcall';
                    return out('PASS',source,`R7 FIXED MB02 D13 : ${HL} HL sous le seuil ${floor} HL ${ownVul?'vulnérable':'non vulnérable'} => Passe`,{natural:false,points:{min:8,max:floor-1},vulnerabilitySensitive:true});
                  }
          """
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          node --check work/mb02/pons-critic.js
          test "$(sha256sum work/mb02/pons-critic.js | awk '{print $1}')" = "$MB02_CRITIC_SHA"
          echo "V261_RUNTIME=$V261_RUNTIME" >> "$GITHUB_ENV"
          echo "MB02_RUNTIME=$(realpath work/mb02)" >> "$GITHUB_ENV"
          echo "FIXED_RUNNER=$(realpath "$CAMP/GATE_RUNNER_FIXED.mjs")" >> "$GITHUB_ENV"
          echo "GENERATOR=$(realpath "$CAMP/GENERATOR.py")" >> "$GITHUB_ENV"

      - name: Recreate exactly the 133 deals
        run: |
          python - <<'PY'
          import importlib.util,json,os
          spec=importlib.util.spec_from_file_location('gen',os.environ['GENERATOR'])
          g=importlib.util.module_from_spec(spec); spec.loader.exec_module(g)
          keys=[]
          with open('MB02_D13_133_KEYS.tsv') as f:
              for line in f:
                  shard,idx,seed=line.rstrip('\n').split('\t'); keys.append((shard,int(idx),int(seed)))
          assert len(keys)==133 and len(set(keys))==133
          with open('work/deals133.jsonl','w') as out:
              for shard,idx,seed in keys:
                  d={'index_global':idx,'seed':seed,'dealer':g.SEATS[idx%4],
                     'vulnerability':g.VUL[idx%16],'hands':g.deal_for(seed)}
                  out.write(json.dumps(d,separators=(',',':'))+'\n')
          PY
          test "$(wc -l < work/deals133.jsonl)" = "$EXPECTED_ROWS"

      - name: Run v2.61 original and MB02
        run: |
          set -euo pipefail
          node "$FIXED_RUNNER" "$V261_RUNTIME" work/deals133.jsonl work/v261.jsonl
          node "$FIXED_RUNNER" "$MB02_RUNTIME" work/deals133.jsonl work/mb02.jsonl
          test "$(wc -l < work/v261.jsonl)" = "$EXPECTED_ROWS"
          test "$(wc -l < work/mb02.jsonl)" = "$EXPECTED_ROWS"

      - name: Build DDS input
        run: |
          python - <<'PY'
          import json
          def load(p):
              d={}
              for line in open(p):
                  x=json.loads(line); d[(int(x['index_global']),int(x['seed']))]=x
              return d
          deals=load('work/deals133.jsonl'); a=load('work/v261.jsonl'); b=load('work/mb02.jsonl')
          shard={(int(i),int(s)):sh for sh,i,s in (line.rstrip('\n').split('\t') for line in open('MB02_D13_133_KEYS.tsv'))}
          def pbn(h): return 'N:'+' '.join('.'.join(h[seat][s] for s in 'SHDC') for seat in 'NESW')
          def cf(c):
              if c.get('passout'): return ['1','0','-','-','NONE']
              return ['0',str(c['level']),c['strain'],c['declarer'],c.get('doubling','NONE')]
          with open('work/DDS_INPUT_133.tsv','w') as out:
              for k in sorted(deals):
                  d=deals[k]; row=[shard[k],str(k[0]),str(k[1]),d['dealer'],d['vulnerability'],pbn(d['hands']),*cf(a[k]['contract']),*cf(b[k]['contract'])]
                  assert len(row)==16
                  out.write('\t'.join(row)+'\n')
          PY
          test "$(wc -l < work/DDS_INPUT_133.tsv)" = "$EXPECTED_ROWS"

      - name: Extract canonical native DDS runner
        run: |
          python - <<'PY'
          import textwrap
          s=open('.github/workflows/solve-fixed-missing-dds.yml').read().splitlines(True)
          start=next(i for i,l in enumerate(s) if "cat > dds_batch_runner.cpp <<'CPP'" in l)+1
          end=next(i for i in range(start,len(s)) if s[i].strip()=='CPP')
          code=textwrap.dedent(''.join(s[start:end]))
          assert '#include "dll.h"' in code and 'CalcAllTablesPBN' in code and 'DealerPar' in code
          open('work/dds_batch_runner.cpp','w').write(code)
          PY
          g++ -std=c++17 -O3 -I odin-dds/external/dds/include work/dds_batch_runner.cpp odin-dds/lib/dds.a -pthread -o work/dds_batch_runner

      - name: Solve 133 with true DDS + DealerPar
        run: |
          set -euo pipefail
          work/dds_batch_runner work/DDS_INPUT_133.tsv work/DDS_RESULTS_133.tsv 2> work/DDS_RESULTS_133.log
          test "$(wc -l < work/DDS_RESULTS_133.tsv)" = "$EXPECTED_ROWS"
          tail -20 work/DDS_RESULTS_133.log

      - name: Finalize D13 DDS performance
        run: |
          python - <<'PY'
          import json,os
          better=worse=equiv=0; delta133=0; rows=0
          for line in open('work/DDS_RESULTS_133.tsv'):
              z=line.rstrip('\n').split('\t'); assert len(z)==11
              ta,sa,tb,sb,prc,par=map(int,z[3:9]); assert prc==1
              vals=list(map(int,z[10].split(','))); assert len(vals)==20 and all(0<=x<=13 for x in vals)
              d=abs(sb-par)-abs(sa-par); delta133+=d; rows+=1
              if d<0: better+=1
              elif d>0: worse+=1
              else: equiv+=1
          assert rows==133
          known=int(os.environ['KNOWN_13655_NET']); original=int(os.environ['ORIGINAL_D13_NET'])
          full=known+delta133
          out={
            'status':'DDS_COMPLETE_133',
            'solver':'TRUE_DDS_PINNED_ODIN_VENDOR',
            'rows':rows,
            'completion_counts':{'BETTER':better,'WORSE':worse,'EQUIVALENT':equiv},
            'completion_net_dds_impact':delta133,
            'known_13655_net_dds_impact':known,
            'full_13788_mb02_d13_net_dds_impact':full,
            'original_r7_d13_net_dds_impact':original,
            'full_improvement':original-full,
            'mb02_critic_sha256':os.environ['MB02_CRITIC_SHA']
          }
          os.makedirs('final',exist_ok=True)
          json.dump(out,open('final/FINAL_D13_DDS_COMPLETION.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: PONS_R7_FIXED_MB02_D13_DDS_COMPLETION
          path: |
            final/FINAL_D13_DDS_COMPLETION.json
            work/DDS_RESULTS_133.tsv
            work/DDS_RESULTS_133.log
          if-no-files-found: error
          retention-days: 30

      - name: Commit DDS completion result
        run: |
          set -euo pipefail
          mkdir -p results/r7-fixed-mb02-d13-dds
          cp final/FINAL_D13_DDS_COMPLETION.json results/r7-fixed-mb02-d13-dds/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/r7-fixed-mb02-d13-dds/FINAL_D13_DDS_COMPLETION.json
          git diff --cached --quiet && exit 0
          git commit -m "Add MB02 D13 true DDS completion"
          git push
