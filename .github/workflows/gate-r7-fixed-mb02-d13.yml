name: Gate R7 FIXED MB02 D13

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/gate-r7-fixed-mb02-d13.yml"

permissions:
  contents: write

env:
  PACKAGE: PONS_R7_FIXED_MB01_D9_GATE_PACKAGE.zip
  R7_CRITIC_SHA: f1991fba7f818668aa55ab1776c63afd6b4f52b3b8a9565b599bc44ec236ca85
  MB01_CRITIC_SHA: 52d548cdd5c41206e89c1d970e12c663850b0955f6157da03bd938dae0df59c8
  MB02_CRITIC_SHA: 6f236dcb597ec5502b44e7e66cd79515051be5268de9f9d010fd621dea8b0511

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: S1
            seed: 996000000001
          - shard: S2
            seed: 996100000001
          - shard: S3
            seed: 996200000001
          - shard: S4
            seed: 996300000001
          - shard: S5
            seed: 996400000001
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build MB01 baseline and MB02 cumulative candidate
        run: |
          set -euo pipefail
          rm -rf work && mkdir -p work/pkg
          unzip -q "$PACKAGE" -d work/pkg
          cd work/pkg
          sha256sum -c SHA256SUMS.txt
          unzip -q R7_GREEN.zip -d ../r7zip
          R7_RUNTIME="$(dirname "$(find ../r7zip -type f -name pons-critic.js | head -1)")"
          test -n "$R7_RUNTIME"
          R7_RUNTIME="$(realpath "$R7_RUNTIME")"
          test "$(sha256sum "$R7_RUNTIME/pons-critic.js" | awk '{print $1}')" = "$R7_CRITIC_SHA"

          cp -a "$R7_RUNTIME" ../mb01
          cp MB01_pons-critic.js ../mb01/pons-critic.js
          test "$(sha256sum ../mb01/pons-critic.js | awk '{print $1}')" = "$MB01_CRITIC_SHA"

          cp -a ../mb01 ../mb02
          python - <<'PY'
          from pathlib import Path
          p=Path('../mb02/pons-critic.js')
          s=p.read_text()
          old="""        const s=exact5[0], target=`1${s}`;
                  const vulState=String(ctx.deal?.vulnerable||'None'), ownSide=sideOf(seat);
                  const ownVul=vulState==='Both'||vulState===ownSide;
                  const floor=ownVul?10:8;
                  if(HL>=floor && legal(target))
                    return out(target,'instance-d-wave2-d13-vulnerability-one-level-overcall',`WAVE2 D13 : ${target} naturel, couleur 5e et ${HL} HL ; seuil PONS ${floor} HL (${ownVul?'vulnérable':'non vulnérable'})`,{suits:{[s]:{min:5,max:5}},points:{min:floor,max:11},vulnerabilitySensitive:true});
                  if(HL<floor && legal('PASS'))
                    return out('PASS','instance-d-wave2-d13-vulnerability-one-level-overcall',`WAVE2 D13 : ${HL} HL sous le seuil PONS ${floor} HL ${ownVul?'vulnérable':'non vulnérable'} => Passe`,{natural:false,points:{min:8,max:floor-1},vulnerabilitySensitive:true});
          """
          new="""        const s=exact5[0], target=`1${s}`;
                  const vulState=String(ctx.deal?.vulnerable||'None'), ownSide=sideOf(seat);
                  const ownVul=vulState==='Both'||vulState===ownSide;
                  const oldFloor=ownVul?10:8;
                  const floor=ownVul?12:11;
                  if(HL>=floor && legal(target))
                    return out(target,'instance-d-wave2-d13-vulnerability-one-level-overcall',`WAVE2 D13 : ${target} naturel, couleur 5e et ${HL} HL ; seuil PONS FIXED ${floor} HL (${ownVul?'vulnérable':'non vulnérable'})`,{suits:{[s]:{min:5,max:5}},points:{min:floor,max:11},vulnerabilitySensitive:true});
                  if(HL<floor && legal('PASS')){
                    const source=HL>=oldFloor?'r7-fixed-mb02-d13-tighten-vulnerability-one-level-overcall':'instance-d-wave2-d13-vulnerability-one-level-overcall';
                    return out('PASS',source,`R7 FIXED MB02 D13 : ${HL} HL sous le seuil ${floor} HL ${ownVul?'vulnérable':'non vulnérable'} => Passe`,{natural:false,points:{min:8,max:floor-1},vulnerabilitySensitive:true});
                  }
          """
          if old not in s:
              raise SystemExit('D13 target block not found exactly once')
          if s.count(old) != 1:
              raise SystemExit(f'D13 target block count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check ../mb02/pons-critic.js
          test "$(sha256sum ../mb02/pons-critic.js | awk '{print $1}')" = "$MB02_CRITIC_SHA"
          echo "MB01_RUNTIME=$(realpath ../mb01)" >> "$GITHUB_ENV"
          echo "MB02_RUNTIME=$(realpath ../mb02)" >> "$GITHUB_ENV"

      - name: Generate 10K fresh deals
        run: python work/pkg/GENERATOR.py work/deals.jsonl 10000 ${{ matrix.seed }}

      - name: Run MB01 GREEN baseline
        run: node work/pkg/GATE_RUNNER_FIXED.mjs "$MB01_RUNTIME" work/deals.jsonl work/mb01.jsonl

      - name: Run MB02 cumulative candidate
        run: node work/pkg/GATE_RUNNER_FIXED.mjs "$MB02_RUNTIME" work/deals.jsonl work/mb02.jsonl

      - name: Compare exact D13 domain
        run: |
          python - <<'PY'
          import json,collections
          def load(p):
              d={}
              with open(p) as f:
                  for line in f:
                      x=json.loads(line); d[(int(x['index_global']),int(x['seed']))]=x
              return d
          A=load('work/mb01.jsonl'); B=load('work/mb02.jsonl')
          assert A.keys()==B.keys()
          st=collections.Counter(); bad=[]; exact=[]
          for k,a in A.items():
              b=B[k]; st['deals']+=1
              if a['auction']==b['auction']:
                  st['same']+=1
                  continue
              st['changed']+=1
              n=min(len(a['auction']),len(b['auction']))
              i=next((j for j in range(n) if a['auction'][j]!=b['auction'][j]),n)
              am=next((m for m in a.get('marks',[]) if m.get('i')==i),None)
              bm=next((m for m in b.get('marks',[]) if m.get('i')==i),None)
              ok=(i<n and am and am.get('reviewedSource')=='instance-d-wave2-d13-vulnerability-one-level-overcall'
                  and a['auction'][i] in ('1D','1H','1S') and b['auction'][i]=='PASS'
                  and bm and bm.get('reviewedSource')=='r7-fixed-mb02-d13-tighten-vulnerability-one-level-overcall')
              if ok:
                  st['exact_d13']+=1
                  exact.append({'index_global':k[0],'seed':k[1],'ply':i,'mb01_call':a['auction'][i],'mb02_call':b['auction'][i]})
              else:
                  st['collateral']+=1
                  bad.append({'index_global':k[0],'seed':k[1],'ply':i,
                              'mb01_call':a['auction'][i] if i<len(a['auction']) else None,
                              'mb02_call':b['auction'][i] if i<len(b['auction']) else None,
                              'mb01_mark':am,'mb02_mark':bm})
          res={'status':'SHARD_PASS' if st['collateral']==0 and st['exact_d13']==st['changed'] else 'SHARD_FAIL',
               **st,'collateral_examples':bad[:20],'exact_examples':exact[:20]}
          json.dump(res,open('work/SUMMARY.json','w'),indent=2)
          print(json.dumps(res))
          if res['status']!='SHARD_PASS': raise SystemExit(4)
          PY

      - name: Verify counts
        run: |
          test "$(wc -l < work/mb01.jsonl)" -eq 10000
          test "$(wc -l < work/mb02.jsonl)" -eq 10000

      - uses: actions/upload-artifact@v4
        with:
          name: mb02-d13-${{ matrix.shard }}
          path: work/SUMMARY.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mb02-d13-*
          path: parts

      - name: Aggregate 50K gate
        run: |
          python - <<'PY'
          import glob,json,os
          parts=[]
          for p in sorted(glob.glob('parts/*/SUMMARY.json')):
              x=json.load(open(p)); parts.append({'artifact':os.path.basename(os.path.dirname(p)),**x})
          assert len(parts)==5, len(parts)
          assert all(x.get('status')=='SHARD_PASS' for x in parts), [x.get('status') for x in parts]
          deals=sum(x['deals'] for x in parts)
          same=sum(x.get('same',0) for x in parts)
          changed=sum(x['changed'] for x in parts)
          exact=sum(x['exact_d13'] for x in parts)
          collateral=sum(len(x.get('collateral_examples',[])) for x in parts)
          assert deals==50000, deals
          assert same+changed==deals, (same,changed,deals)
          assert exact==changed, (exact,changed)
          assert collateral==0, collateral
          out={'status':'FINAL_GATE_PASS','baseline':'R7_FIXED_MB01_D9_GREEN','candidate':'R7_FIXED_MB02_D9_D13',
               'deals':deals,'same':same,'changed':changed,'exact_d13':exact,'collateral':collateral,
               'shards':parts,'mb01_critic_sha256':os.environ['MB01_CRITIC_SHA'],
               'mb02_critic_sha256':os.environ['MB02_CRITIC_SHA']}
          os.makedirs('final',exist_ok=True)
          json.dump(out,open('final/FINAL_GATE_SUMMARY.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: PONS_R7_FIXED_MB02_D13_FINAL_GATE
          path: final/
          if-no-files-found: error
          retention-days: 30

      - name: Commit final gate result
        run: |
          set -euo pipefail
          mkdir -p results/r7-fixed-mb02-d13-gate
          cp final/FINAL_GATE_SUMMARY.json results/r7-fixed-mb02-d13-gate/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/r7-fixed-mb02-d13-gate/FINAL_GATE_SUMMARY.json
          git diff --cached --quiet && exit 0
          git commit -m "Add R7 FIXED MB02 D13 50K gate result"
          git push
