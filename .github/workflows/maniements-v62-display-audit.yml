name: MANIEMENTS V6.2 — Humanizer display audit

on:
  push:
    branches: [main]
    paths:
      - "maniements-v5/product/v6/V62_DISPLAY_AUDIT_START"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        case_id: [SUITPLAY_ENC, ROUD_2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/runtime.zip"
          cat maniements-v5/runtime/runtime_v2.b64.part-00 \
              maniements-v5/runtime/runtime_v2.b64.part-01 \
              maniements-v5/runtime/runtime_v2.b64.part-02a \
              maniements-v5/runtime/runtime_v2.b64.part-02b \
              maniements-v5/runtime/runtime_v2.b64.part-03 \
              maniements-v5/runtime/runtime_v2.b64.part-04 \
              maniements-v5/runtime/runtime_v2.b64.part-05 \
              maniements-v5/runtime/runtime_v2.b64.part-06 | base64 -d > "$ZIP"
          mkdir -p "$RUNNER_TEMP/unpacked" && unzip -q "$ZIP" -d "$RUNNER_TEMP/unpacked"
      - name: Audit ${{ matrix.case_id }}
        shell: bash
        run: |
          python3 maniements-v5/product/v6/audit_humanizer_display_v62.py \
            --runtime-root "$RUNNER_TEMP/unpacked" \
            --tools-root maniements-v5/dictionary \
            --case-id "${{ matrix.case_id }}" \
            --output "DISPLAY_${{ matrix.case_id }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: DISPLAY_AUDIT_${{ matrix.case_id }}
          path: DISPLAY_${{ matrix.case_id }}.json
          retention-days: 30
