name: Compare v2.61 vs R7 GREEN - fixed vulnerability harness

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "PONS_CMP500K_V261_VS_R7_GREEN_FIXED_CAMPAIGN.zip"
      - ".github/workflows/compare-v261-r7-fixed.yml"

permissions:
  contents: write

jobs:
  compare:
    name: compare ${{ matrix.shard }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: S1
            seed: 992000000001
            deals_sha256: 62d29fbc302afe0e45d20ac85ba36f17a2983f944bc08195b6faf841ea0f0174
          - shard: S2
            seed: 992100000001
            deals_sha256: 7726a8e1bca509f011d0195e3f95271adf476cc136e3b5ccad8f5a919a601dd9
          - shard: S3
            seed: 992200000001
            deals_sha256: f97cc22b73bcad25190f7c7f125f1aad8ca61229b3b465c90dffb412b365f527
          - shard: S4
            seed: 992300000001
            deals_sha256: 79ce7b05c3baa9d7cc08e7d00d8b0a90277ca6d64811b62be90b7cb254cafadd
          - shard: S5
            seed: 992400000001
            deals_sha256: ed48267e250521e2a4a8d2140a11dc8cd902872e097dc5e3f7b8444ddce808ad

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract campaign and verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s PONS_CMP500K_V261_VS_R7_GREEN_FIXED_CAMPAIGN.zip
          rm -rf work
          mkdir -p work
          unzip -q PONS_CMP500K_V261_VS_R7_GREEN_FIXED_CAMPAIGN.zip -d work
          cd work/CMP500K_FIXED_PACKAGE
          sha256sum -c SHA256SUMS.txt
          test "$(sha256sum BASELINE_V261_ORIGINAL.zip | awk '{print $1}')" = "718974c8cb2159898b93b2fc93111509f96b145b99e9af3d62559b7fbf5c80b5"
          test "$(sha256sum CANDIDATE_R7_GREEN.zip | awk '{print $1}')" = "a530af6124316b4705663ffba8c0aa042764d9309bacd9b7401d6e815098207b"
          test "$(sha256sum GENERATOR.py | awk '{print $1}')" = "cb45c4d7c450bb674d9f984cc077f566a4f596b0e6db9ba3734cd94c94a0b457"
          test "$(sha256sum GATE_RUNNER_FIXED.mjs | awk '{print $1}')" = "87cf2b70a9a54dc7df1bffe3dac418783f030b91cc31e75eadae672cc7c51869"
          test "$(sha256sum COMPARE.py | awk '{print $1}')" = "8fdf03a2492d4855ed477e0de61385b6c31cb2db1b8d3af792f3b026bd31c80c"
          node --check GATE_RUNNER_FIXED.mjs
          python3 -m py_compile GENERATOR.py COMPARE.py

      - name: Extract baseline and candidate runtimes
        shell: bash
        run: |
          set -euo pipefail
          cd work/CMP500K_FIXED_PACKAGE
          mkdir -p extracted/base extracted/r7
          unzip -q BASELINE_V261_ORIGINAL.zip -d extracted/base
          unzip -q CANDIDATE_R7_GREEN.zip -d extracted/r7
          test -s extracted/base/PONS_v2.61/play/pons/pkg/pons_wasm_bg.wasm
          test -s extracted/base/PONS_v2.61/play/pons-critic.js
          test -s extracted/r7/PONS_V3.00_CMP500K_R7_GREEN_CHECKPOINT/PONS_V3.00_CMP500K_R7_PLAY_TESTABLE/pons/pkg/pons_wasm_bg.wasm
          test -s extracted/r7/PONS_V3.00_CMP500K_R7_GREEN_CHECKPOINT/PONS_V3.00_CMP500K_R7_PLAY_TESTABLE/pons-critic.js

      - name: Generate exact paired 100K shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SEED: ${{ matrix.seed }}
          EXPECTED_DEALS_SHA: ${{ matrix.deals_sha256 }}
        run: |
          set -euo pipefail
          cd work/CMP500K_FIXED_PACKAGE
          python3 GENERATOR.py deals.jsonl 100000 "$SEED"
          test "$(wc -l < deals.jsonl)" -eq 100000
          echo "$EXPECTED_DEALS_SHA  deals.jsonl" | sha256sum -c -
          sha256sum deals.jsonl > "${SHARD}_DEALS_SHA256.txt"

      - name: Run original v2.61 baseline with corrected harness
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cd work/CMP500K_FIXED_PACKAGE
          node GATE_RUNNER_FIXED.mjs \
            extracted/base/PONS_v2.61/play \
            deals.jsonl \
            "${SHARD}_V261.jsonl"
          test "$(wc -l < "${SHARD}_V261.jsonl")" -eq 100000

      - name: Run sealed R7 GREEN candidate with corrected harness
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cd work/CMP500K_FIXED_PACKAGE
          node GATE_RUNNER_FIXED.mjs \
            extracted/r7/PONS_V3.00_CMP500K_R7_GREEN_CHECKPOINT/PONS_V3.00_CMP500K_R7_PLAY_TESTABLE \
            deals.jsonl \
            "${SHARD}_R7.jsonl"
          test "$(wc -l < "${SHARD}_R7.jsonl")" -eq 100000

      - name: Compare and preserve every difference
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          cd work/CMP500K_FIXED_PACKAGE
          python3 COMPARE.py deals.jsonl "${SHARD}_V261.jsonl" "${SHARD}_R7.jsonl" "$SHARD"
          python3 - "$SHARD" "$SEED" <<'PY'
          import json,sys
          shard,seed=sys.argv[1],int(sys.argv[2])
          p=f"{shard}_RAW_SUMMARY.json"
          s=json.load(open(p,encoding="utf-8"))
          assert s["deals"]==100000, s
          assert s["same"]+s["differences"]==100000, s
          s["shard"]=shard
          s["master_seed"]=seed
          s["harness_status"]="FIXED_VULNERABLE_ALIAS"
          s["runtime_changes"]="NONE"
          json.dump(s,open(p,"w",encoding="utf-8"),indent=2,sort_keys=True)
          PY
          gzip -9 "${SHARD}_RAW_DIFFERENCES.jsonl"
          sha256sum \
            "${SHARD}_RAW_DIFFERENCES.jsonl.gz" \
            "${SHARD}_RAW_SUMMARY.json" \
            "${SHARD}_DEALS_SHA256.txt" \
            > "${SHARD}_SHA256SUMS.txt"

      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: fixed-shard-${{ matrix.shard }}
          path: |
            work/CMP500K_FIXED_PACKAGE/${{ matrix.shard }}_RAW_DIFFERENCES.jsonl.gz
            work/CMP500K_FIXED_PACKAGE/${{ matrix.shard }}_RAW_SUMMARY.json
            work/CMP500K_FIXED_PACKAGE/${{ matrix.shard }}_DEALS_SHA256.txt
            work/CMP500K_FIXED_PACKAGE/${{ matrix.shard }}_SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

  aggregate:
    name: aggregate corrected 500K
    runs-on: ubuntu-22.04
    needs: compare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all corrected shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fixed-shard-*
          path: incoming
          merge-multiple: true

      - name: Verify and aggregate 500K
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          python3 - <<'PY'
          import gzip,json,glob,hashlib,os,shutil

          expected=["S1","S2","S3","S4","S5"]
          summaries=[]
          total={"deals":0,"differences":0,"auction_only_same_contract":0,"contract_changed":0,"same":0}

          for shard in expected:
              sp=f"incoming/{shard}_RAW_SUMMARY.json"
              dp=f"incoming/{shard}_RAW_DIFFERENCES.jsonl.gz"
              hp=f"incoming/{shard}_SHA256SUMS.txt"
              assert os.path.isfile(sp), sp
              assert os.path.isfile(dp), dp
              assert os.path.isfile(hp), hp
              s=json.load(open(sp,encoding="utf-8"))
              assert s["shard"]==shard
              assert s["deals"]==100000
              assert s["same"]+s["differences"]==100000
              summaries.append(s)
              for k in total: total[k]+=int(s[k])
              shutil.copy2(sp,f"final/{shard}_RAW_SUMMARY.json")
              shutil.copy2(dp,f"final/{shard}_RAW_DIFFERENCES.jsonl.gz")
              shutil.copy2(f"incoming/{shard}_DEALS_SHA256.txt",f"final/{shard}_DEALS_SHA256.txt")

          assert total["deals"]==500000,total
          assert total["same"]+total["differences"]==500000,total
          assert total["auction_only_same_contract"]+total["contract_changed"]==total["differences"],total

          agg={
              "campaign":"PONS_CMP500K_V261_VS_R7_GREEN_FIXED_HARNESS",
              "status":"RAW_FIXED_500K_COMPLETE",
              "harness_fix":"deal.vulnerable = deal.vulnerability",
              "runtime_changes":"NONE",
              "baseline_sha256":"718974c8cb2159898b93b2fc93111509f96b145b99e9af3d62559b7fbf5c80b5",
              "candidate_sha256":"a530af6124316b4705663ffba8c0aa042764d9309bacd9b7401d6e815098207b",
              "generator_sha256":"cb45c4d7c450bb674d9f984cc077f566a4f596b0e6db9ba3734cd94c94a0b457",
              "fixed_runner_sha256":"87cf2b70a9a54dc7df1bffe3dac418783f030b91cc31e75eadae672cc7c51869",
              "compare_sha256":"8fdf03a2492d4855ed477e0de61385b6c31cb2db1b8d3af792f3b026bd31c80c",
              "totals":total,
              "shards":summaries
          }
          json.dump(agg,open("final/FIXED_RAW_500K_SUMMARY.json","w",encoding="utf-8"),indent=2,sort_keys=True)

          # Consolidated difference stream. Add shard only in this aggregate copy;
          # original per-shard rows remain byte-for-byte preserved in their gzip files.
          rows=0
          with gzip.open("final/FIXED_RAW_500K_DIFFERENCES.jsonl.gz","wt",encoding="utf-8",compresslevel=9) as out:
              for shard in expected:
                  with gzip.open(f"incoming/{shard}_RAW_DIFFERENCES.jsonl.gz","rt",encoding="utf-8") as f:
                      for line in f:
                          if not line.strip(): continue
                          x=json.loads(line)
                          x={"shard":shard,**x}
                          out.write(json.dumps(x,separators=(",",":"))+"\n")
                          rows+=1
          assert rows==total["differences"],(rows,total)
          PY
          (
            cd final
            sha256sum * > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload complete corrected 500K raw result
        uses: actions/upload-artifact@v4
        with:
          name: PONS_CMP500K_V261_VS_R7_GREEN_FIXED_RAW_COMPLETE
          path: final/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Commit verified corrected results to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          rm -rf results/cmp500k-fixed
          mkdir -p results/cmp500k-fixed
          cp final/* results/cmp500k-fixed/
          git add results/cmp500k-fixed
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Add corrected v2.61 vs R7 GREEN 500K raw results"
            git push origin HEAD:main
          fi
