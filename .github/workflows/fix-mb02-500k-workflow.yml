name: Fix MB02 500K workflow

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/fix-mb02-500k-workflow.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Replace embedded D13 reconstruction with proven patch helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/compare-v261-mb02-500k-dds.yml')
          s=p.read_text()
          marker="          python3 - <<'PY'\n          from pathlib import Path\n          p=Path('work/mb02/pons-critic.js')\n"
          if "patch -p0 < ../tools/MB01_TO_MB02_D13.patch" in s:
              print('target workflow already repaired')
              raise SystemExit(0)
          start=s.index(marker)
          end=s.index('          test "$(sha256sum work/mb02/pons-critic.js', start)
          replacement=(
              "          (\n"
              "            cd work\n"
              "            patch -p0 < ../tools/MB01_TO_MB02_D13.patch\n"
              "          )\n"
          )
          new=s[:start]+replacement+s[end:]
          if new==s:
              raise SystemExit('no replacement applied')
          p.write_text(new)
          print('replaced fragile embedded Python block with patch helper')
          PY

      - name: Validate workflow text
        shell: bash
        run: |
          set -euo pipefail
          grep -q "patch -p0 < ../tools/MB01_TO_MB02_D13.patch" .github/workflows/compare-v261-mb02-500k-dds.yml
          grep -q "MB02_CRITIC_SHA" .github/workflows/compare-v261-mb02-500k-dds.yml

      - name: Commit corrected 500K workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/compare-v261-mb02-500k-dds.yml
          if git diff --cached --quiet; then
            echo "No target workflow change required"
            exit 0
          fi
          git commit -m "Fix MB02 500K reconstruction using proven D13 patch"
          git push origin HEAD:main
