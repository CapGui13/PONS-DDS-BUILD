name: Recover MB08 DDS compact F1 payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-mb08-dds-input.yml'
      - 'inputs/mb08_f1_xz_b64/**'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Search missing base64 char near chunk boundaries
        run: |
          set -euo pipefail
          cat inputs/mb08_f1_xz_b64/f1_00 inputs/mb08_f1_xz_b64/f1_01 inputs/mb08_f1_xz_b64/f1_02 | tr -d '\r\n' > bad.b64
          test "$(wc -c < bad.b64)" = 59999
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          : > matches.txt
          # Missing character is most likely around a copy boundary. Search ±16 chars around 20k, 40k, and EOF.
          for center in 20000 40000 59999; do
            for ((pos=center-16; pos<=center+16; pos++)); do
              [ "$pos" -ge 0 ] || continue
              [ "$pos" -le 59999 ] || continue
              head -c "$pos" bad.b64 > left
              tail -c +$((pos+1)) bad.b64 > right
              for ((i=0;i<${#alphabet};i++)); do
                c=${alphabet:i:1}
                { cat left; printf '%s' "$c"; cat right; } > cand.b64
                base64 -d cand.b64 > cand.xz 2>/dev/null || continue
                if xz -t cand.xz 2>/dev/null; then
                  printf '%s\t%s\n' "$pos" "$c" >> matches.txt
                fi
              done
            done
          done
          {
            echo "searched_boundary_positions=99"
            echo "valid_candidates=$(wc -l < matches.txt)"
            cat matches.txt
          } | tee RECOVER_F1_REPORT.txt
          if [ "$(wc -l < matches.txt)" = 1 ]; then
            read POS C < matches.txt
            head -c "$POS" bad.b64 > left
            tail -c +$((POS+1)) bad.b64 > right
            { cat left; printf '%s' "$C"; cat right; } > complete.b64
            base64 -d complete.b64 > complete.xz
            xz -t complete.xz
            xz -dc complete.xz > complete.bin
            {
              echo "recovered_pos=$POS"
              echo "recovered_char=$C"
              echo "xz_sha256=$(sha256sum complete.xz | awk '{print $1}')"
              echo "decoded_bytes=$(wc -c < complete.bin)"
              echo "decoded_sha256=$(sha256sum complete.bin | awk '{print $1}')"
              echo "decoded_lines=$(wc -l < complete.bin)"
              echo "decoded_file=$(file -b complete.bin)"
              xxd -g1 -l256 complete.bin
              strings complete.bin | head -40 || true
            } | tee -a RECOVER_F1_REPORT.txt
          fi
      - name: Persist recovery report
        run: |
          set -euo pipefail
          mkdir -p results/mb08-dds-inspect
          cp RECOVER_F1_REPORT.txt results/mb08-dds-inspect/RECOVER_F1_REPORT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/mb08-dds-inspect/RECOVER_F1_REPORT.txt
          git diff --cached --quiet || git commit -m 'Search MB08 DDS F1 missing base64 char'
          git push
