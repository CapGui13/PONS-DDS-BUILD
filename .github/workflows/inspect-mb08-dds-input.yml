name: Inspect MB08 DDS staged input

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-mb08-dds-input.yml'
      - 'inputs/mb08_v2_b64/**'
      - 'inputs/mb08_f1_xz_b64/**'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect candidate payloads
        run: |
          set -euo pipefail
          : > INSPECT_MB08_INPUT.txt
          for spec in 'v2:inputs/mb08_v2_b64/p_*' 'f1:inputs/mb08_f1_xz_b64/f1_*'; do
            name=${spec%%:*}; pattern=${spec#*:}
            echo "===== $name =====" | tee -a INSPECT_MB08_INPUT.txt
            ls -1 $pattern | sort -V > parts.list
            cat $(cat parts.list) > payload.b64
            tr -d '\r\n' < payload.b64 > payload.clean.b64
            base64 -d payload.clean.b64 > payload.xz
            set +e
            xz -t payload.xz 2> xzt.err; XZTEST=$?
            xz -dc payload.xz > payload.dec 2> xz.err; XZRC=$?
            set -e
            {
              echo "parts=$(wc -l < parts.list)"
              echo "b64_bytes=$(wc -c < payload.clean.b64)"
              echo "xz_bytes=$(wc -c < payload.xz)"
              echo "xz_sha256=$(sha256sum payload.xz | awk '{print $1}')"
              echo "xz_test_rc=$XZTEST"
              echo "xz_decode_rc=$XZRC"
              echo "decoded_bytes=$(wc -c < payload.dec)"
              echo "decoded_lines=$(wc -l < payload.dec)"
              echo "decoded_sha256=$(sha256sum payload.dec | awk '{print $1}')"
              echo "decoded_file=$(file -b payload.dec)"
              echo '--- xz test stderr ---'; cat xzt.err
              echo '--- xz decode stderr ---'; cat xz.err
              echo '--- first 256 bytes hex ---'; xxd -g1 -l256 payload.dec || true
              echo '--- first 30 strings ---'; strings payload.dec | head -30 || true
            } | tee -a INSPECT_MB08_INPUT.txt
          done
      - name: Commit inspection report
        run: |
          set -euo pipefail
          mkdir -p results/mb08-dds-inspect
          cp INSPECT_MB08_INPUT.txt results/mb08-dds-inspect/INSPECT_MB08_INPUT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/mb08-dds-inspect/INSPECT_MB08_INPUT.txt
          git diff --cached --quiet || git commit -m 'Inspect MB08 DDS candidate payloads'
          git push
