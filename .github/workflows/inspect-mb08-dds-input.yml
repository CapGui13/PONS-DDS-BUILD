name: Inspect MB08 DDS staged input

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-mb08-dds-input.yml'
      - 'inputs/mb08_v2_b64/**'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct staged payload v2
        run: |
          set -euo pipefail
          cat inputs/mb08_v2_b64/p_00 inputs/mb08_v2_b64/p_01 inputs/mb08_v2_b64/p_02 > payload.b64
          tr -d '\r\n' < payload.b64 > payload.clean.b64
          base64 -d payload.clean.b64 > payload.xz
          xz -t payload.xz
          xz -dc payload.xz > payload.dec
          {
            echo "b64_bytes=$(wc -c < payload.clean.b64)"
            echo "xz_bytes=$(wc -c < payload.xz)"
            echo "xz_sha256=$(sha256sum payload.xz | awk '{print $1}')"
            echo "decoded_bytes=$(wc -c < payload.dec)"
            echo "decoded_sha256=$(sha256sum payload.dec | awk '{print $1}')"
            echo "decoded_lines=$(wc -l < payload.dec)"
            echo "file=$(file -b payload.dec)"
            echo '--- first 10 strings ---'
            strings payload.dec | head -10 || true
          } | tee INSPECT_MB08_INPUT.txt
      - name: Commit inspection report
        run: |
          set -euo pipefail
          mkdir -p results/mb08-dds-inspect
          cp INSPECT_MB08_INPUT.txt results/mb08-dds-inspect/INSPECT_MB08_INPUT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/mb08-dds-inspect/INSPECT_MB08_INPUT.txt
          git diff --cached --quiet || git commit -m 'Inspect MB08 DDS v2 payload'
          git push
