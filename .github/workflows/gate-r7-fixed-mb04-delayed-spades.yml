name: Gate R7 FIXED MB04 delayed Spade fit

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/gate-r7-fixed-mb04-delayed-spades.yml"
      - "tools/MB03_TO_MB04_DELAYED_SPADES_RKCB.patch"
      - "tools/run_mb04_gate_shard.sh"
      - "tools/aggregate_mb04_gate.py"

permissions:
  contents: write

jobs:
  gate:
    name: gate ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: S1, seed: 999000000001, deals_sha256: c591c4446c5e2c6282f8a8dfc7aebf3400266a0b483c908f4db7e9e2f04e1e29 }
          - { shard: S2, seed: 999100000001, deals_sha256: 26bc27cc94a0f327a21697fd71613a015aca084815ebfeeb58a18dd477f721d4 }
          - { shard: S3, seed: 999200000001, deals_sha256: 0dcdaf774be066b5369f1fb461d4ba037804706f671c4205c37a907b8c022503 }
          - { shard: S4, seed: 999300000001, deals_sha256: 45f1213937181962ae5ba43036a6711fdac1b0a0f6499511c5b1523ceb3c73c7 }
          - { shard: S5, seed: 999400000001, deals_sha256: d1184e9fde1b6cf6fbf222bfc5fce504231e7d81aa1b24dc90b2140bdd9ff83a }
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Run exact 20K shard
        run: bash tools/run_mb04_gate_shard.sh "${{ matrix.shard }}" "${{ matrix.seed }}" "${{ matrix.deals_sha256 }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mb04-delayed-spades-${{ matrix.shard }}
          path: ${{ matrix.shard }}_SUMMARY.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mb04-delayed-spades-*
          path: incoming
          merge-multiple: true
      - run: python3 tools/aggregate_mb04_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: PONS_R7_FIXED_MB04_DELAYED_SPADES_100K_GATE
          path: final/
          retention-days: 30
      - name: Commit compact result
        run: |
          git pull --rebase origin main
          mkdir -p results/r7-fixed-mb04-delayed-spades-gate
          cp final/FINAL_GATE_SUMMARY.json results/r7-fixed-mb04-delayed-spades-gate/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/r7-fixed-mb04-delayed-spades-gate
          if ! git diff --cached --quiet; then
            git commit -m "Add R7 FIXED MB04 delayed Spade 100K gate result"
            git push origin HEAD:main
          fi
