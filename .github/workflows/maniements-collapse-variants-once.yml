name: Maniements collapse variants once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maniements-collapse-variants-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact qualified production index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('vercel/play-dds-native/maniements/index.html')
          b=p.read_bytes()
          old_sha=hashlib.sha256(b).hexdigest()
          assert old_sha == '2cd127d9cac667a1a9b1d2f5c5232ba25c32c07d609840690e2e7ded2e941f87', old_sha
          s=b.decode('utf-8')
          needle="    if (a.state==='CONDITIONAL' || a.state==='COVERAGE_INSUFFICIENT') details.open=true;\n"
          assert s.count(needle)==1, s.count(needle)
          s=s.replace(needle,'',1)
          p.write_text(s, encoding='utf-8')
          new_sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert new_sha == '75d51f4de1676fc9945aa1a76c025ccd0cec18806dff4b5ca96938f02e2dd5a6', new_sha
          PY
      - name: Verify variants are closed by default
        run: |
          ! grep -q "details.open=true" vercel/play-dds-native/maniements/index.html
          grep -q "Voir les variantes" vercel/play-dds-native/maniements/index.html
      - name: Commit production UX adjustment and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/maniements-collapse-variants-once.yml
          git config user.name 'PONS DDS Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add vercel/play-dds-native/maniements/index.html .github/workflows/maniements-collapse-variants-once.yml
          git commit -m 'Collapse Maniements variants by default'
          git push origin HEAD:main
